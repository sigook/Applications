# Azure Pipeline for Sigook.Web (Vue.js 3 Application)
# Builds Docker image and deploys to Azure App Service Container

name: SigookWeb-$(Date:yyyyMMdd)$(Rev:.r)

# Trigger on dev branch with Sigook.Web changes
# Production (main) deployments are triggered manually
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - Sigook.Web/**
    exclude:
      - Sigook.Web/**/*.md

# PR trigger - only validate PRs to dev (not to main)
# PRs to main are trusted since dev is the quality gate
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - Sigook.Web/**

pool:
  name: 'covenant-build-pool'

# Environment detection variables
# Target values resolve at compile time: main/master → production, anything else → staging
variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/Sigook.Web'
  isMain: $[in(variables['Build.SourceBranch'], 'refs/heads/main','refs/heads/master','main','master')]
  isDev: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
  ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
    deployEnvironment: 'production'
    dockerTag: 'latest_production'
    azureAppName: 'sigook'
    appUrl: 'https://sigook.azurewebsites.net'
  ${{ if notIn(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
    deployEnvironment: 'staging'
    dockerTag: 'latest_staging'
    azureAppName: 'sigook-web-staging'
    appUrl: 'https://sigook-web-staging.azurewebsites.net'

stages:
  # ============================================
  # Stage 1: Validate, Build and Docker Image
  # ============================================
  - stage: Build_and_Test
    displayName: 'Build and Validate'
    jobs:
      - job: Validate
        displayName: 'Lint, Type-check and Build'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
            fetchDepth: 1

          # Setup Node.js (shared template — Vite 8 requires Node ^20.19 || >=22.12)
          - template: templates/node-setup.yml
            parameters:
              nodeVersion: '22'

          # Install pnpm (version resolved from the packageManager field in package.json)
          - script: |
              corepack enable || npm i -g "$(node -p "require('./package.json').packageManager")"
              corepack prepare --activate 2>/dev/null || true
              pnpm --version
            displayName: 'Setup pnpm'
            workingDirectory: $(workingDirectory)

          # Resolve pnpm store directory for caching
          - script: |
              echo "##vso[task.setvariable variable=pnpmStorePath]$(pnpm store path --silent)"
            displayName: 'Resolve pnpm store path'
            workingDirectory: $(workingDirectory)

          # Cache pnpm content-addressable store
          - task: Cache@2
            displayName: 'Cache pnpm store'
            inputs:
              key: 'pnpm | "$(Agent.OS)" | $(workingDirectory)/pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(pnpmStorePath)

          # Install dependencies (frozen lockfile + scripts blocked by .npmrc)
          - script: pnpm install --frozen-lockfile
            displayName: 'Install Dependencies'
            workingDirectory: $(workingDirectory)

          # Run linting
          - script: pnpm run lint
            displayName: 'Lint Code'
            workingDirectory: $(workingDirectory)

          # TypeScript type checking (the only vue-tsc run; the build below calls vite directly)
          - script: pnpm run type-check
            displayName: 'TypeScript Type Check'
            workingDirectory: $(workingDirectory)

          - ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/dev', 'refs/heads/development') }}:
            # Replace tokens in index.html (root) + public/*.json (version.json etc.)
            # Vite 3+ moved index.html to the project root — previously was in public/.
            - task: qetza.replacetokens.replacetokens-task.replacetokens@6
              displayName: 'Set Version in index.html and version.json'
              inputs:
                root: '$(Build.SourcesDirectory)/Sigook.Web'
                sources: |
                  index.html
                  public/**/*.html
                  public/**/*.json
                tokenPattern: 'custom'
                tokenPrefix: '#{'
                tokenSuffix: '}#'
                actionOnMissing: 'warn'
                writeBOM: true
                encoding: 'auto'

          # Vite build — PRs resolve to staging and only build to catch bundling errors
          - script: pnpm exec vite build --mode $(deployEnvironment)
            displayName: 'Vite Build ($(deployEnvironment))'
            workingDirectory: $(workingDirectory)

          - ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/dev', 'refs/heads/development') }}:
            # Build Docker Image (nginx + prebuilt wwwroot)
            - task: Docker@2
              displayName: 'Build Docker Image'
              inputs:
                command: 'build'
                repository: 'sigook.azurecr.io/web'
                dockerfile: 'Sigook.Web/Dockerfile'
                buildContext: 'Sigook.Web'
                # $(dockerTag) is mutable (latest_staging/latest_production) and is
                # kept for anything that tracks the newest image. The deploy targets
                # the immutable $(Build.BuildId) tag, so a restart cannot silently
                # pull an image that was never deployed, and rollback stays possible.
                tags: |
                  $(dockerTag)
                  $(Build.BuildId)

            # Push Docker Image to ACR
            - task: Docker@2
              displayName: 'Push Docker Image to ACR'
              inputs:
                containerRegistry: 'acrServiceConnectionSigook'
                repository: 'web'
                command: 'push'
                tags: |
                  $(dockerTag)
                  $(Build.BuildId)

          # Cleanup after build
          - template: templates/cleanup.yml
            parameters:
              cleanDocker: true
              cleanNodeModules: true
              workingDirectory: '$(workingDirectory)'

  # ============================================
  # Stage 2: Deploy
  # ============================================
  - stage: CI_CD
    displayName: 'Deploy'
    dependsOn: Build_and_Test
    condition: and(succeeded(), or(eq(variables['isDev'], true), eq(variables['isMain'], true)))
    jobs:
      - deployment: Deploy_to_Azure
        displayName: 'Deploy to Azure App Service'
        environment: ${{ variables.deployEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                # Deploy to Azure App Service (Container)
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to $(azureAppName)'
                  inputs:
                    azureSubscription: 'SigookPipelines'
                    appName: $(azureAppName)
                    containers: 'sigook.azurecr.io/web:$(Build.BuildId)'
                    appSettings: '-CVN_VERSION $(Build.BuildId)'

                - script: |
                    echo "🚀 Deployed sigook.azurecr.io/web:$(Build.BuildId) to $(azureAppName) ($(deployEnvironment))"
                    echo "URL: $(appUrl)"
                  displayName: 'Deployment Summary'

  # ============================================
  # Stage 3: Notify Production Deployment
  # ============================================
  - stage: Notify
    displayName: 'Notify Production Deploy'
    dependsOn: CI_CD
    condition: and(succeeded(), eq(variables['isMain'], true))
    jobs:
      - job: SendEmail
        displayName: 'Send Deployment Email'
        variables:
          - group: Sigook-Notifications
        steps:
          - checkout: none
          - template: templates/notify-deployment.yml
            parameters:
              appType: 'agency-portal'
              recipients: '$(NotificationRecipients)'
