name: Sigook.App-Screenshots-$(Date:yyyyMMdd)$(Rev:.r)

# PIPELINE: Sigook.App store screenshots (manual)
# ============================================
# Drives Sigook.App/integration_test/store_screenshots_test.dart against
# staging on a hosted macOS agent and publishes the captures in the folder
# layout fastlane expects, ready to unzip into Sigook.App/ and commit:
#   fastlane/screenshots/en-US/                               iPhone 6.9" + iPad 13" (deliver)
#   fastlane/metadata/android/en-US/images/phoneScreenshots/  1080x1920 (supply)
# Nobody on the team has a Mac, so iOS captures can only come from here; the
# Android ones can also be taken locally with scripts/store_screenshots.sh.
# Uploading to the stores is done by sigook-app-pipeline.yml
# (parameter uploadStoreScreenshots) from the committed files.
# ============================================

trigger: none
pr: none

parameters:
- name: macosImage
  displayName: 'Hosted macOS image'
  type: string
  default: 'macOS-26'
- name: xcodeVersion
  displayName: 'Xcode version installed on the image'
  type: string
  default: '26.6'
- name: flutterVersion
  displayName: 'Flutter version (must match sigook-app-pipeline.yml)'
  type: string
  default: '3.47.4'
- name: iphoneSimulator
  displayName: 'iPhone simulator (6.9" class, 1320x2868)'
  type: string
  default: 'iPhone 17 Pro Max'
- name: ipadSimulator
  displayName: 'iPad simulator (13" class, 2064x2752)'
  type: string
  default: 'iPad Pro 13-inch (M4)'
- name: androidSystemImage
  displayName: 'Android system image for the emulator (arch is appended)'
  type: string
  default: 'system-images;android-35;google_apis'
- name: captureAndroid
  displayName: 'Also capture Android on an emulator'
  type: boolean
  default: true
- name: screenshotLocation
  displayName: 'GPS position the device reports as "lat,lon" (the punch card needs a fix; use the address of the first job of the screenshot account)'
  type: string
  default: '37.697173,-77.669072'

variables:
- group: SigookApp-Staging
- name: workingDirectory
  value: '$(System.DefaultWorkingDirectory)/Sigook.App'
- name: outputRoot
  value: '$(Build.ArtifactStagingDirectory)/store-screenshots'

stages:
- stage: Capture
  displayName: 'Capture store screenshots'
  pool:
    vmImage: '${{ parameters.macosImage }}'
  jobs:
  - job: Screenshots
    displayName: 'iOS simulators + Android emulator'
    timeoutInMinutes: 60
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
        fetchDepth: 1
    - script: |
        XCODE_APP="/Applications/Xcode_${{ parameters.xcodeVersion }}.app"
        if [ ! -d "$XCODE_APP" ]; then
          echo "ERROR: $XCODE_APP not found on ${{ parameters.macosImage }}. Installed versions:"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"
        xcodebuild -version
        uname -m
      displayName: 'Select Xcode ${{ parameters.xcodeVersion }}'
    - task: Cache@2
      displayName: 'Cache Flutter Packages'
      inputs:
        key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock'
        restoreKeys: |
          pub | "$(Agent.OS)"
        path: $(HOME)/.pub-cache
    - task: Cache@2
      displayName: 'Cache CocoaPods'
      inputs:
        key: 'pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile | $(workingDirectory)/pubspec.lock'
        restoreKeys: |
          pods | "$(Agent.OS)"
        path: $(HOME)/Library/Caches/CocoaPods
    - template: templates/flutter-setup.yml
      parameters:
        flutterVersion: '${{ parameters.flutterVersion }}'
        cacheSdk: true
    - task: CmdLine@2
      displayName: 'Flutter Pub Get'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub get
    - task: Bash@3
      displayName: 'Check screenshot account variables'
      env:
        SCREENSHOT_USER: $(SCREENSHOT_USER)
        SCREENSHOT_PASSWORD: $(SCREENSHOT_PASSWORD)
      inputs:
        targetType: 'inline'
        script: |
          if [ -z "${SCREENSHOT_USER:-}" ] || [ -z "${SCREENSHOT_PASSWORD:-}" ]; then
            echo "##vso[task.logissue type=error]SCREENSHOT_USER / SCREENSHOT_PASSWORD missing from the SigookApp-Staging variable group"
            exit 1
          fi
          echo "Screenshot account: $SCREENSHOT_USER"
    - task: Bash@3
      displayName: 'Capture iOS (iPhone + iPad)'
      env:
        SCREENSHOT_USER: $(SCREENSHOT_USER)
        SCREENSHOT_PASSWORD: $(SCREENSHOT_PASSWORD)
        SCREENSHOT_GEO: ${{ parameters.screenshotLocation }}
        GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)'
        script: |
          set -euo pipefail
          OUT="$(outputRoot)/fastlane/screenshots/en-US"
          mkdir -p "$OUT"

          boot_simulator() {
            local name="$1"
            local udid
            udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          name = sys.argv[1]
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"] == name and d["isAvailable"]:
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)' "$name") || {
              echo "ERROR: simulator '$name' not available on this image. Available iOS devices:"
              xcrun simctl list devices available | grep -E "iPhone|iPad"
              exit 1
            }
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            echo "$udid"
          }

          IPHONE=$(boot_simulator "${{ parameters.iphoneSimulator }}" | tail -1)
          echo "=== iPhone ${{ parameters.iphoneSimulator }} ($IPHONE) ==="
          bash scripts/store_screenshots.sh ios "$IPHONE" "$OUT"
          xcrun simctl shutdown "$IPHONE"

          IPAD=$(boot_simulator "${{ parameters.ipadSimulator }}" | tail -1)
          echo "=== iPad ${{ parameters.ipadSimulator }} ($IPAD) ==="
          bash scripts/store_screenshots.sh ios "$IPAD" "$OUT" "ipad_"
          xcrun simctl shutdown "$IPAD"
    - ${{ if eq(parameters.captureAndroid, true) }}:
      - task: Bash@3
        displayName: 'Capture Android (emulator)'
        env:
          SCREENSHOT_USER: $(SCREENSHOT_USER)
          SCREENSHOT_PASSWORD: $(SCREENSHOT_PASSWORD)
          SCREENSHOT_GEO: ${{ parameters.screenshotLocation }}
          GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
        inputs:
          targetType: 'inline'
          workingDirectory: '$(workingDirectory)'
          script: |
            set -euo pipefail
            OUT="$(outputRoot)/fastlane/metadata/android/en-US/images/phoneScreenshots"
            mkdir -p "$OUT"

            case "$(uname -m)" in
              arm64) ABI="arm64-v8a" ;;
              *) ABI="x86_64" ;;
            esac
            IMAGE="${{ parameters.androidSystemImage }};$ABI"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "emulator" "$IMAGE"
            echo no | "$AVDMANAGER" create avd -n screenshots -k "$IMAGE" -d pixel_6 --force

            "$ANDROID_HOME/emulator/emulator" -avd screenshots -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$(Build.ArtifactStagingDirectory)/emulator.log" 2>&1 &
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
              echo "waiting for emulator boot..."
              sleep 5
            done
            adb shell input keyevent 82
            adb devices

            bash scripts/store_screenshots.sh android emulator-5554 "$OUT"
            adb emu kill || true
    - task: Bash@3
      displayName: 'List captures'
      inputs:
        targetType: 'inline'
        script: |
          find "$(outputRoot)" -type f -name '*.png' | sort | while read -r file; do
            echo "${file#$(outputRoot)/}: $(sips -g pixelWidth -g pixelHeight "$file" | awk '/pixel/ {printf "%s ", $2}')"
          done
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Screenshots Artifact'
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: '$(outputRoot)'
        ArtifactName: 'store-screenshots'
        publishLocation: 'Container'
