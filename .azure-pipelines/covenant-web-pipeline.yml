# Azure Pipeline for covenantWeb (Vue.js Marketing Website)
# Builds and deploys Vue.js app to Azure Static Web Apps

name: CovenantWeb-$(Date:yyyyMMdd)$(Rev:.r)

# Trigger on dev branch with covenantWeb changes
# Production (main) deployments are triggered manually
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - Covenant.Web/**
    exclude:
      - Covenant.Web/**/*.md

# PR trigger - only validate PRs to dev (not to main)
# PRs to main are trusted since dev is the quality gate
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - Covenant.Web/**

pool:
  name: 'covenant-build-pool'

# Environment detection variables
variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/Covenant.Web'
  nodeVersion: '20.x'
  isMain: $[in(variables['Build.SourceBranch'], 'refs/heads/main','refs/heads/master','main','master')]
  isDev: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
  isPR: $[eq(variables['Build.Reason'], 'PullRequest')]
  # For PRs, determine environment based on target branch
  targetBranch: $[coalesce(variables['System.PullRequest.TargetBranch'], variables['Build.SourceBranchName'])]

stages:
  - stage: CI_CD
    displayName: 'CI/CD Pipeline'
    jobs:
      # ============================================
      # Job 1: Build and Test
      # ============================================
      - job: Build_and_Test
        displayName: 'Build and Test Application'
        # Run on direct pushes to main/dev OR on Pull Requests
        condition: or(eq(variables['isDev'], true), eq(variables['isMain'], true), eq(variables['isPR'], true))
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Determine environment and build command
          - script: |
              echo "Build Reason: $(Build.Reason)"
              echo "Source Branch: $(Build.SourceBranch)"

              # For Pull Requests, use target branch to determine environment
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                targetBranch="$(System.PullRequest.TargetBranch)"
                echo "Pull Request detected"
                echo "Target Branch: $targetBranch"

                # Determine environment based on PR target branch
                if [[ "$targetBranch" == *"main"* ]] || [[ "$targetBranch" == *"master"* ]]; then
                  environment=production
                  buildCommand=build:production
                else
                  environment=staging
                  buildCommand=build:staging
                fi
              else
                # Regular push - use source branch
                echo "Direct push to $(Build.SourceBranchName)"
                if [ "$(isDev)" = True ]; then
                  environment=staging
                  buildCommand=build:staging
                else
                  environment=production
                  buildCommand=build:production
                fi
              fi

              echo "##vso[task.setvariable variable=environment]$environment"
              echo "##vso[task.setvariable variable=environment;isOutput=true]$environment"
              echo "##vso[task.setvariable variable=buildCommand]$buildCommand"
              echo ""
              echo "Environment: $environment"
              echo "Build Command: pnpm run $buildCommand"
            name: SetEnvironment
            displayName: 'Determine Environment'

          # Setup Node.js (shared template — Vite 7 requires Node ^20.19 || >=22.12)
          - template: templates/node-setup.yml
            parameters:
              nodeVersion: '22'

          # Install pnpm (version resolved from the packageManager field in package.json)
          - script: |
              corepack enable || npm i -g "$(node -p "require('./package.json').packageManager")"
              corepack prepare --activate 2>/dev/null || true
              pnpm --version
            displayName: 'Setup pnpm'
            workingDirectory: $(workingDirectory)

          # Display build information
          - task: Bash@3
            displayName: 'Build Information'
            inputs:
              targetType: 'inline'
              script: |
                echo "============================================"
                echo "CovenantWeb Build Pipeline"
                echo "============================================"
                echo "Build Number: $(Build.BuildNumber)"
                echo "Build ID: $(Build.BuildId)"
                echo "Branch: $(Build.SourceBranch)"
                echo "Environment: $(environment)"
                echo "Build Command: $(buildCommand)"
                echo "Node: $(node --version)"
                echo "pnpm: $(pnpm --version)"
                echo "============================================"

          # Resolve pnpm store directory for caching
          - script: |
              echo "##vso[task.setvariable variable=pnpmStorePath]$(pnpm store path --silent)"
            displayName: 'Resolve pnpm store path'
            workingDirectory: $(workingDirectory)

          # Cache pnpm content-addressable store (more reliable than caching node_modules)
          - task: Cache@2
            displayName: 'Cache pnpm store'
            inputs:
              key: 'pnpm | "$(Agent.OS)" | $(workingDirectory)/pnpm-lock.yaml'
              path: '$(pnpmStorePath)'

          # Install dependencies (frozen lockfile + scripts blocked by .npmrc)
          - script: pnpm install --frozen-lockfile
            displayName: 'pnpm install'
            workingDirectory: $(workingDirectory)

          # Type checking
          - script: pnpm run type-check
            displayName: 'Type Check'
            workingDirectory: $(workingDirectory)

          # Linting
          - script: pnpm run lint
            displayName: 'Lint Code'
            workingDirectory: $(workingDirectory)

          # Build application
          - script: pnpm run $(buildCommand)
            displayName: 'Build $(environment)'
            workingDirectory: $(workingDirectory)

          # Verify build output
          - task: Bash@3
            displayName: 'Verify Build Output'
            inputs:
              targetType: 'inline'
              script: |
                echo "Verifying build output..."
                if [ ! -d "$(workingDirectory)/dist" ]; then
                  echo "❌ Error: dist directory not found!"
                  exit 1
                fi
                if [ ! -f "$(workingDirectory)/dist/index.html" ]; then
                  echo "❌ Error: index.html not found in dist!"
                  exit 1
                fi
                echo "✅ Build output verified"
                echo ""
                echo "Build contents:"
                ls -lh $(workingDirectory)/dist

          # Publish dist as artifact (only on direct pushes, not PRs)
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            condition: ne(variables['Build.Reason'], 'PullRequest')
            inputs:
              PathtoPublish: '$(workingDirectory)/dist'
              ArtifactName: 'covenantweb-dist'
              publishLocation: 'Container'

          # Build summary
          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "✅ Build completed successfully!"
                echo "🌍 Environment: $(environment)"

                # Show artifact info only if created (not on PRs)
                if [ "$(Build.Reason)" != "PullRequest" ]; then
                  echo "📦 Artifact: covenantweb-dist"
                else
                  echo "📋 PR validation completed - no artifacts created"
                fi

          # Cleanup after build
          - template: templates/cleanup.yml
            parameters:
              cleanNodeModules: false
              workingDirectory: '$(workingDirectory)'

      # ============================================
      # Job 2: Deploy to Azure Static Web Apps
      # ============================================
      - job: Deploy_to_Azure
        displayName: 'Deploy to Azure Static Web Apps'
        dependsOn: Build_and_Test
        # Only deploy on direct pushes to main/dev, NOT on Pull Requests
        condition: and(succeeded(), or(eq(variables['isDev'], true), eq(variables['isMain'], true)), ne(variables['isPR'], true))
        variables:
          environment: $[ dependencies.Build_and_Test.outputs['SetEnvironment.environment'] ]
        steps:
          - download: current
            artifact: covenantweb-dist
            displayName: 'Download Build Artifacts'

          # Determine target Static Web App and fetch its deployment token
          - task: AzureCLI@2
            displayName: 'Set Static Web App Target'
            inputs:
              azureSubscription: 'SigookPipelines'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                if [ "$(isDev)" = True ]; then
                  envLabel="Staging"
                  swaName="covenantgroup-staging-swa"
                  swaResourceGroup="CovenantGroupStaging"
                else
                  envLabel="Production"
                  swaName="covenantgroup-swa"
                  swaResourceGroup="CovenantGroup"
                fi
                swaToken=$(az staticwebapp secrets list --name "$swaName" --resource-group "$swaResourceGroup" --query "properties.apiKey" -o tsv)
                echo "##vso[task.setvariable variable=swaToken;issecret=true]$swaToken"
                echo "##vso[task.setvariable variable=envLabel]$envLabel"
                echo "##vso[task.setvariable variable=swaName]$swaName"
                echo "Deploying to: $swaName ($envLabel)"
                echo "Build ID: $(Build.BuildId)"

          # Deploy prebuilt dist to Azure Static Web Apps
          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Azure Static Web Apps'
            inputs:
              cwd: '$(Pipeline.Workspace)'
              app_location: 'covenantweb-dist'
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: '$(swaToken)'

          # Deployment summary
          - task: Bash@3
            displayName: 'Deployment Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "============================================"
                echo "✅ Deployment Completed!"
                echo "============================================"
                echo "Environment: $(envLabel)"
                echo "Static Web App: $(swaName)"
                echo "Version: $(Build.BuildId)"
                echo "============================================"
                echo ""
                echo "URLs:"
                if [ "$(isDev)" = True ]; then
                  echo "🌐 Staging: https://lively-island-020c8260f.7.azurestaticapps.net"
                else
                  echo "🌐 Production: https://www.covenantgroupl.com"
                fi

  # ============================================
  # Stage 2: Notify Production Deployment
  # ============================================
  - stage: Notify
    displayName: 'Notify Production Deploy'
    dependsOn: CI_CD
    condition: and(succeeded(), eq(variables['isMain'], true))
    pool:
      name: 'covenant-build-pool'
    jobs:
      - job: SendEmail
        displayName: 'Send Deployment Email'
        variables:
          - group: Sigook-Notifications
        steps:
          - checkout: none
          - template: templates/notify-deployment.yml
            parameters:
              appType: 'website'
              recipients: '$(NotificationRecipients)'
