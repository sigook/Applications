name: Release-Production-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - release/*

pr: none

parameters:
  - name: deployApi
    displayName: 'Deploy API'
    type: boolean
    default: true

  - name: deployWeb
    displayName: 'Deploy Web'
    type: boolean
    default: true

extends:
  template: templates/release-template.yml
  parameters:
    deployApi: ${{ parameters.deployApi }}
    deployWeb: ${{ parameters.deployWeb }}
