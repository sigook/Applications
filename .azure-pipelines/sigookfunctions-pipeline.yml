# Azure Pipeline for SigookFunctions (Azure Functions .NET 6)
# Builds, tests, and deploys Azure Functions to Azure Function App

name: SigookFunctions-$(Year:yyyy).$(Month).$(DayOfMonth).$(Rev:r)

# Only trigger when SigookFunctions files change
trigger:
  branches:
    include:
      - main
      - master
      - dev
  paths:
    include:
      - .gitignore
      - SigookFunctions/**
      - .azure-pipelines/sigookfunctions-pipeline.yml
    exclude:
      - SigookFunctions/**/*.md

# PR trigger - only validate PRs to dev (not to main)
# PRs to main are trusted since dev is the quality gate
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - SigookFunctions/**

pool:
  vmImage: 'ubuntu-22.04'

# Environment detection variables
variables:
  isMain: $[in(variables['Build.SourceBranch'], 'refs/heads/main','refs/heads/master','main','master')]
  isDev: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
  dotnetSdkVersion: '6.0.420'

stages:
  # ============================================
  # Stage 1: Build and Test
  # ============================================
  - stage: Build_and_Test
    displayName: 'Build and Test'
    jobs:
      - job: Build_Test_Solution
        displayName: 'Build and Run Tests'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Install .NET SDK using template
          - template: templates/dotnet-setup.yml
            parameters:
              sdkVersion: $(dotnetSdkVersion)

          # Build and Test using template
          - template: templates/dotnet-build-test.yml
            parameters:
              buildProjects: 'SigookFunctions/**/*.sln'
              buildConfiguration: 'Release'
              runUnitTests: true
              unitTestProjects: 'SigookFunctions/**/Tests/*.csproj'
              runIntegrationTests: false

  # ============================================
  # Stage 2: Publish and Deploy
  # ============================================
  - stage: CI_CD
    displayName: 'Publish and Deploy'
    dependsOn: Build_and_Test
    condition: and(succeeded(), or(eq(variables['isDev'], true), eq(variables['isMain'], true)))
    jobs:
      - job: Publish_and_Deploy
        displayName: 'Publish and Deploy to Azure'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Install .NET SDK
          - template: templates/dotnet-setup.yml
            parameters:
              sdkVersion: $(dotnetSdkVersion)

          # Authenticate with Azure Artifacts for Covenant.Common package
          - task: NuGetAuthenticate@1
            displayName: 'Authenticate NuGet Feed'

          # Publish Azure Functions
          - task: DotNetCoreCLI@2
            displayName: 'Publish Azure Functions'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'SigookFunctions/SigookFunctions/SigookFunctions.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: true

          # Determine environment and app name
          - script: |
              if [ "$(isDev)" = "True" ] || [ "$(isDev)" = "true" ]; then
                echo "##vso[task.setvariable variable=azureFunctionAppName]sigook-functions-staging"
                echo "##vso[task.setvariable variable=environment]Staging"
              else
                echo "##vso[task.setvariable variable=azureFunctionAppName]sigook-functions"
                echo "##vso[task.setvariable variable=environment]Production"
              fi
            displayName: 'Set Environment Variables'

          # Deploy to Azure Function App
          - task: AzureFunctionApp@2
            displayName: 'Deploy to Azure Function App'
            inputs:
              azureSubscription: 'SigookPipelines'
              appType: 'functionApp'
              appName: $(azureFunctionAppName)
              package: '$(Build.ArtifactStagingDirectory)/publish/*.zip'
              appSettings: '-AZURE_FUNCTIONS_ENVIRONMENT $(environment)'
              deploymentMethod: 'auto'

          # Deployment Summary
          - task: Bash@3
            displayName: 'Deployment Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "============================================"
                echo "Deployment Completed!"
                echo "============================================"
                echo "Environment: $(environment)"
                echo "Function App: $(azureFunctionAppName)"
                echo "Version: $(Build.BuildId)"
                echo "============================================"
                echo ""
                echo "URLs:"
                if [ "$(isDev)" = "True" ] || [ "$(isDev)" = "true" ]; then
                  echo "Staging: https://sigook-functions-staging.azurewebsites.net"
                else
                  echo "Production: https://sigook-functions.azurewebsites.net"
                fi
                echo ""
