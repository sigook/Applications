# Reusable template for .NET Build and Test
# Usage:
#   - template: templates/dotnet-build-test.yml
#     parameters:
#       buildProjects: '**/*.sln'
#       runUnitTests: true
#       unitTestProjects: '**/Covenant.Tests/*.csproj'
#       runIntegrationTests: false
#       coverageSettings: 'Covenant.Api/coverage.runsettings'
#       coverageWorkingDirectory: 'Covenant.Api'
#       minLineCoverage: 80

parameters:
  - name: buildProjects
    type: string
    displayName: 'Projects or solutions to build'

  - name: buildConfiguration
    type: string
    default: 'Release'
    displayName: 'Build configuration (Release/Debug)'

  - name: runUnitTests
    type: boolean
    default: true
    displayName: 'Run unit tests'

  - name: unitTestProjects
    type: string
    default: ''
    displayName: 'Unit test project pattern'

  - name: runIntegrationTests
    type: boolean
    default: false
    displayName: 'Run integration tests'

  - name: integrationTestProjects
    type: string
    default: ''
    displayName: 'Integration test project pattern'

  - name: coverageSettings
    type: string
    default: ''
    displayName: 'Runsettings file that enables code coverage (empty = no coverage)'

  - name: coverageWorkingDirectory
    type: string
    default: ''
    displayName: 'Folder holding dotnet-tools.json and coverage-gate.cs'

  - name: minLineCoverage
    type: number
    default: 0
    displayName: 'Minimum line coverage (%) required to pass the build'

steps:
  # Build Solution/Projects
  - task: DotNetCoreCLI@2
    displayName: 'Build ${{ parameters.buildConfiguration }}'
    inputs:
      command: 'build'
      projects: ${{ parameters.buildProjects }}
      arguments: '--configuration ${{ parameters.buildConfiguration }}'

  # Run Unit Tests (if enabled)
  - ${{ if eq(parameters.runUnitTests, true) }}:
    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: ${{ parameters.unitTestProjects }}
        ${{ if eq(parameters.coverageSettings, '') }}:
          arguments: '--logger "console;verbosity=minimal" --no-build --configuration ${{ parameters.buildConfiguration }}'
        ${{ else }}:
          arguments: '--logger "console;verbosity=minimal" --no-build --configuration ${{ parameters.buildConfiguration }} --settings ${{ parameters.coverageSettings }}'
        testRunTitle: 'Unit Tests'
        publishTestResults: true

  # Run Integration Tests (if enabled)
  - ${{ if eq(parameters.runIntegrationTests, true) }}:
    - task: DotNetCoreCLI@2
      displayName: 'Run Integration Tests'
      inputs:
        command: 'test'
        projects: ${{ parameters.integrationTestProjects }}
        ${{ if eq(parameters.coverageSettings, '') }}:
          arguments: '--logger "console;verbosity=minimal" --no-build --configuration ${{ parameters.buildConfiguration }}'
        ${{ else }}:
          arguments: '--logger "console;verbosity=minimal" --no-build --configuration ${{ parameters.buildConfiguration }} --settings ${{ parameters.coverageSettings }}'
        testRunTitle: 'Integration Tests'
        publishTestResults: true

  # Merge coverage, publish it and enforce the minimum (if enabled)
  - ${{ if ne(parameters.coverageSettings, '') }}:
    - script: |
        dotnet tool restore
        dotnet tool run reportgenerator "-reports:$(Agent.TempDirectory)/**/*.cobertura.xml" "-targetdir:$(Agent.TempDirectory)/coverage" "-reporttypes:Cobertura;TextSummary"
        cat "$(Agent.TempDirectory)/coverage/Summary.txt"
      displayName: 'Merge Code Coverage'
      workingDirectory: ${{ parameters.coverageWorkingDirectory }}

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/coverage/Cobertura.xml'

    - script: dotnet run coverage-gate.cs "$(Agent.TempDirectory)/coverage/Cobertura.xml" ${{ parameters.minLineCoverage }}
      displayName: 'Code Coverage Gate (min ${{ parameters.minLineCoverage }}%)'
      workingDirectory: ${{ parameters.coverageWorkingDirectory }}
