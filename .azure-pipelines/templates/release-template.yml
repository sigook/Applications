parameters:
  - name: deployApi
    type: boolean
    default: true

  - name: deployWeb
    type: boolean
    default: true

  - name: notifications
    type: object
    default:
      - appType: platform
        api: 'true'
        web: 'true'
      - appType: api
        api: 'true'
        web: 'false'
      - appType: agency-portal
        api: 'false'
        web: 'true'

variables:
  isProduction: $[startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')]
  isStaging: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
    deployEnvironment: 'production'
    dockerTag: 'latest_production'
    apiAppName: 'sigook-api'
    webAppName: 'sigook'
  ${{ else }}:
    deployEnvironment: 'staging'
    dockerTag: 'latest_staging'
    apiAppName: 'sigook-api-staging'
    webAppName: 'sigook-web-staging'

stages:
  - stage: Build
    displayName: 'Build and Test'
    pool:
      name: 'covenant-build-pool'
    jobs:
      - template: detect-changes.yml
        parameters:
          deployApi: ${{ parameters.deployApi }}
          deployWeb: ${{ parameters.deployWeb }}

      - ${{ if parameters.deployApi }}:
        - template: api-build-job.yml
          parameters:
            dockerTag: $(dockerTag)
            publishImage: ${{ or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}

      - ${{ if parameters.deployWeb }}:
        - template: web-build-job.yml
          parameters:
            deployEnvironment: $(deployEnvironment)
            dockerTag: $(dockerTag)
            publishImage: ${{ or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}

  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Build
    pool:
      name: 'covenant-build-pool'
    condition: and(succeeded(), or(eq(variables['isStaging'], true), eq(variables['isProduction'], true)))
    jobs:
      - deployment: Release
        displayName: 'Release to Azure App Service'
        environment: ${{ variables.deployEnvironment }}
        condition: or(eq(stageDependencies.Build.DetectChanges.outputs['detect.api'], 'true'), eq(stageDependencies.Build.DetectChanges.outputs['detect.web'], 'true'))
        variables:
          apiChanged: $[ stageDependencies.Build.DetectChanges.outputs['detect.api'] ]
          webChanged: $[ stageDependencies.Build.DetectChanges.outputs['detect.web'] ]
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - ${{ if parameters.deployWeb }}:
                  - template: slot-prepare.yml
                    parameters:
                      appName: $(webAppName)
                      condition: "and(succeeded(), eq(variables.webChanged, 'true'))"
                      image: web

                - ${{ if parameters.deployApi }}:
                  - template: slot-prepare.yml
                    parameters:
                      appName: $(apiAppName)
                      condition: "and(succeeded(), eq(variables.apiChanged, 'true'))"
                      image: api

                  - template: slot-swap.yml
                    parameters:
                      appName: $(apiAppName)
                      condition: "and(succeeded(), eq(variables.apiChanged, 'true'))"

                - ${{ if parameters.deployWeb }}:
                  - template: slot-swap.yml
                    parameters:
                      appName: $(webAppName)
                      condition: "and(succeeded(), eq(variables.webChanged, 'true'))"

                - ${{ if parameters.deployApi }}:
                  - template: slot-stop.yml
                    parameters:
                      appName: $(apiAppName)
                      condition: "and(always(), eq(variables.apiChanged, 'true'))"

                - ${{ if parameters.deployWeb }}:
                  - template: slot-stop.yml
                    parameters:
                      appName: $(webAppName)
                      condition: "and(always(), eq(variables.webChanged, 'true'))"

  - stage: Notify
    displayName: 'Notify Production Deploy'
    dependsOn:
      - Build
      - Deploy
    pool:
      name: 'covenant-build-pool'
    condition: and(succeeded(), eq(variables['isProduction'], true))
    variables:
      - group: Sigook-Notifications
    jobs:
      - ${{ each notification in parameters.notifications }}:
        - job: Notify_${{ replace(notification.appType, '-', '_') }}
          displayName: 'Send Deployment Email (${{ notification.appType }})'
          condition: and(eq(stageDependencies.Build.DetectChanges.outputs['detect.api'], '${{ notification.api }}'), eq(stageDependencies.Build.DetectChanges.outputs['detect.web'], '${{ notification.web }}'))
          steps:
            - checkout: none
            - template: notify-deployment.yml
              parameters:
                appType: ${{ notification.appType }}
                recipients: '$(NotificationRecipients)'
