parameters:
  - name: deployApi
    type: boolean
    default: true

  - name: deployWeb
    type: boolean
    default: true

variables:
  isProduction: $[startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')]
  isStaging: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
    deployEnvironment: 'production'
    dockerTag: 'latest_production'
    apiAppName: 'sigook-api'
    webAppName: 'sigook'
  ${{ else }}:
    deployEnvironment: 'staging'
    dockerTag: 'latest_staging'
    apiAppName: 'sigook-api-staging'
    webAppName: 'sigook-web-staging'

stages:
  - stage: Build
    displayName: 'Build and Test'
    pool:
      name: 'covenant-build-pool'
    jobs:
      - ${{ if parameters.deployApi }}:
        - template: api-build-job.yml
          parameters:
            dockerTag: $(dockerTag)
            publishImage: ${{ or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}

      - ${{ if parameters.deployWeb }}:
        - template: web-build-job.yml
          parameters:
            deployEnvironment: $(deployEnvironment)
            dockerTag: $(dockerTag)
            publishImage: ${{ or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}

  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Build
    pool:
      name: 'covenant-build-pool'
    condition: and(succeeded(), or(eq(variables['isStaging'], true), eq(variables['isProduction'], true)))
    jobs:
      - deployment: Release
        displayName: 'Release to Azure App Service'
        environment: ${{ variables.deployEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - ${{ if parameters.deployWeb }}:
                  - template: slot-prepare.yml
                    parameters:
                      appName: $(webAppName)
                      image: web

                - ${{ if parameters.deployApi }}:
                  - template: slot-prepare.yml
                    parameters:
                      appName: $(apiAppName)
                      image: api

                  - template: slot-swap.yml
                    parameters:
                      appName: $(apiAppName)

                - ${{ if parameters.deployWeb }}:
                  - template: slot-swap.yml
                    parameters:
                      appName: $(webAppName)

                - ${{ if parameters.deployApi }}:
                  - template: slot-stop.yml
                    parameters:
                      appName: $(apiAppName)

                - ${{ if parameters.deployWeb }}:
                  - template: slot-stop.yml
                    parameters:
                      appName: $(webAppName)

  - stage: Notify
    displayName: 'Notify Production Deploy'
    dependsOn: Deploy
    pool:
      name: 'covenant-build-pool'
    condition: and(succeeded(), eq(variables['isProduction'], true))
    jobs:
      - job: SendEmail
        displayName: 'Send Deployment Email'
        variables:
          - group: Sigook-Notifications
        steps:
          - checkout: none
          - template: notify-deployment.yml
            parameters:
              ${{ if and(parameters.deployApi, parameters.deployWeb) }}:
                appType: 'platform'
              ${{ elseif parameters.deployApi }}:
                appType: 'api'
              ${{ else }}:
                appType: 'agency-portal'
              recipients: '$(NotificationRecipients)'
