# Azure Pipeline for SigookApp (Flutter Mobile Application)
# Currently optimized for iOS IPA build only - other stages disabled to save minutes

name: SigookApp-$(Date:yyyyMMdd)$(Rev:.r)

# Only trigger when SigookApp files change
trigger:
  branches:
    include:
      - main
      - dev
      - SigookApp
  paths:
    include:
      - SigookApp/**
      - .azure-pipelines/sigookapp-pipeline.yml
    exclude:
      - SigookApp/README.md
      - SigookApp/docs/**
      - SigookApp/**/*.md

# PR trigger - only validate PRs to dev (not to main)
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - SigookApp/**
      - .azure-pipelines/sigookapp-pipeline.yml
    exclude:
      - SigookApp/README.md
      - SigookApp/docs/**

variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/SigookApp'
  flutterVersion: 'stable'

stages:
  # ============================================
  # Stage 1: Validate and Test (DISABLED)
  # ============================================
  - stage: Validate_and_Test
    displayName: 'Validate & Test'
    condition: false # DISABLED to save minutes
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Flutter_Test
        displayName: 'Flutter Analyze & Test'
        steps:
          - script: echo "Validation stage disabled"

  # ============================================
  # Stage 2: Build Android AAB (DISABLED)
  # ============================================
  - stage: Build_Android_Staging
    displayName: 'Build Android (Staging)'
    condition: false # DISABLED to save minutes - re-enable when needed
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      - group: SigookApp-Staging
      - group: App Configuration Staging
      - group: SigookApp-Android-Signing
    jobs:
      - job: Build_AAB_Staging
        displayName: 'Build Staging AAB'
        steps:
          - script: echo "Android build stage disabled"

  # ============================================
  # Stage 3: Build iOS IPA (ACTIVE)
  # ============================================
  # This is the only active stage - builds IPA and publishes as downloadable artifact
  - stage: Build_iOS_Staging
    displayName: 'Build iOS IPA'
    dependsOn: []
    condition: true
    pool:
      vmImage: 'macos-14'
    variables:
      - group: SigookApp-Staging
      - group: SigookApp-iOS-Signing
    jobs:
      - job: Build_IPA_Staging
        displayName: 'Build Staging IPA'
        steps:
          - checkout: self
            displayName: 'Checkout'

          # Install Apple Certificate
          - task: InstallAppleCertificate@2
            displayName: 'Install Certificate'
            inputs:
              certSecureFile: 'new-distribution.p12'
              certPwd: '$(SIGOOK-DISTRIBUTION-PASSWORD)'
              keychain: 'temp'

          # Install Provisioning Profile
          - task: InstallAppleProvisioningProfile@1
            name: installProvisioningProfile
            displayName: 'Install Provisioning Profile'
            inputs:
              provisioningProfileLocation: 'secureFiles'
              provProfileSecureFile: '$(PROVISIONING_PROFILE)'
              removeProfile: true

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Run code generation
          - script: |
              cd $(workingDirectory)
              flutter pub run build_runner build --delete-conflicting-outputs
            displayName: 'Code Generation'

          # Install CocoaPods
          - script: |
              cd $(workingDirectory)/ios
              pod install
            displayName: 'Pod Install'
            continueOnError: true

          # Select Xcode version (before any Xcode operations)
          - script: sudo xcode-select -s /Applications/Xcode_16.1.app
            displayName: 'Select Xcode 16.1'

          # Install fastlane and xcodeproj gem (needed for signing configuration)
          - script: |
              sudo gem install fastlane -NV
              sudo gem install xcodeproj -NV
            displayName: 'Install Fastlane'

          # Build iOS with Flutter (no codesign - fastlane will sign later)
          # The Xcode project now has DEVELOPMENT_TEAM set, so this should work
          # iOS OAuth config: CLIENT_ID=ios, redirect uses com.all2job scheme
          - script: |
              cd $(workingDirectory)
              flutter build ios \
                -t lib/main_staging.dart \
                --release \
                --no-codesign \
                --build-number=$(Build.BuildId) \
                --dart-define=ENVIRONMENT=staging \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                --dart-define=CLIENT_ID=ios \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI_IOS)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI_IOS)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"
            displayName: 'Flutter Build iOS'

          # Archive and sign with fastlane
          - script: |
              cd $(workingDirectory)
              fastlane ios beta
            displayName: 'Fastlane Archive & Sign'
            env:
              FASTLANE_SKIP_UPDATE_CHECK: "true"
              FASTLANE_HIDE_CHANGELOG: "true"

          # Prepare IPA artifact
          - script: |
              cd $(workingDirectory)
              mkdir -p $(Build.ArtifactStagingDirectory)/ios
              IPA_PATH=$(find output -name "*.ipa" 2>/dev/null | head -1)
              if [ -n "$IPA_PATH" ]; then
                cp "$IPA_PATH" $(Build.ArtifactStagingDirectory)/ios/sigook-staging-$(Build.BuildId).ipa
                echo "✅ IPA ready: sigook-staging-$(Build.BuildId).ipa"
              else
                echo "❌ IPA not found!"
                find . -name "*.ipa" 2>/dev/null || echo "No IPAs found"
                exit 1
              fi
            displayName: 'Prepare IPA'

          # Publish IPA artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish IPA'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios'
              ArtifactName: 'sigookapp-ios-staging'
              publishLocation: 'Container'

          - script: |
              echo ""
              echo "========================================"
              echo "✅ iOS IPA Build Complete!"
              echo "========================================"
              echo "Artifact: sigookapp-ios-staging"
              echo "File: sigook-staging-$(Build.BuildId).ipa"
              echo ""
              echo "📥 DOWNLOAD: Pipeline > Artifacts > sigookapp-ios-staging"
              echo "========================================"
            displayName: 'Build Summary'

  # ============================================
  # Stage 4: Deploy iOS to TestFlight (DISABLED)
  # ============================================
  - stage: Deploy_iOS_TestFlight
    displayName: 'Deploy to TestFlight'
    dependsOn: Build_iOS_Staging
    condition: false # DISABLED - download IPA from artifacts instead
    pool:
      vmImage: 'macos-14'
    jobs:
      - job: Deploy_TestFlight
        steps:
          - script: echo "TestFlight deployment disabled"

  # ============================================
  # Stage 5: Deploy Android to Google Play (DISABLED)
  # ============================================
  - stage: Deploy_Android_PlayStore
    displayName: 'Deploy to Google Play'
    dependsOn: Build_Android_Staging
    condition: false # DISABLED - Android build is disabled
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Deploy_PlayStore
        steps:
          - script: echo "Google Play deployment disabled"
