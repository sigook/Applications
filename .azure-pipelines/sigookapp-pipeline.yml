name: SigookApp-$(Date:yyyyMMdd)$(Rev:.r)

# PIPELINE: SigookApp iOS + Android CI/CD
# ============================================
# TRIGGER POLICY:
# - Runs on direct pushes to dev branch (Staging)
# - Runs on PRs to dev branch (validation only, no build or deploy)
# - Production (main) deployments are triggered manually (Run pipeline -> branch main)
#
# DEPLOY TARGETS:
# - dev  -> TestFlight internal group "Staging" + Google Play closed testing (alpha track)
# - main -> App Store (submitted for review) + Google Play production track
#
# POOLS:
# - Validate, Version, Android build/deploy: self-hosted covenant-build-pool (Linux)
# - iOS build/deploy: Microsoft-hosted macOS ($(macosImage)); fastlane's
#   upload goes through Apple's Transporter, which only exists on macOS
#
# iOS signing is handled by fastlane match (SigookApp/fastlane/Matchfile):
# the certificate and profile live encrypted in the MATCH_GIT_URL repo and are
# created by match itself on the first run (matchReadonly=false). No Apple
# secure files are involved.
# ============================================

# Trigger on dev branch with SigookApp changes
# Production (main) deployments are triggered manually
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - SigookApp/**
    exclude:
      - SigookApp/**/*.md

# PR trigger - only validate PRs to dev (not to main)
# PRs to main are trusted since dev is the quality gate
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - SigookApp/**

# Declared so the job access token may reach the match signing repo (never
# checked out; match clones it itself with System.AccessToken).
resources:
  repositories:
  - repository: signing
    type: git
    name: sigook/sigook-ios-signing
    ref: refs/heads/main

parameters:
- name: matchReadonly
  displayName: 'match readonly (false only on the first run so match creates the certificate and profile)'
  type: boolean
  default: true

variables:
- name: workingDirectory
  value: '$(System.DefaultWorkingDirectory)/SigookApp'
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
- name: isDev
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/dev')]
- name: isPR
  value: $[eq(variables['Build.Reason'], 'PullRequest')]
- name: flutterVersion
  value: '3.47.4'
- name: macosImage
  value: 'macOS-26'
# Must exist on the hosted image; Microsoft rotates the installed Xcode versions
- name: xcodeVersion
  value: '26.6'
# Environment name for display purposes
- name: environment
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    value: 'production'
  ${{ else }}:
    value: 'staging'
# Flutter entry point file
- name: entryPoint
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    value: 'lib/main_production.dart'
  ${{ else }}:
    value: 'lib/main_staging.dart'
# Google Play track (alpha = closed testing)
- name: playTrack
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    value: 'production'
  ${{ else }}:
    value: 'alpha'
# fastlane iOS upload lane (beta = TestFlight, release = App Store review)
- name: iosLane
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    value: 'release'
  ${{ else }}:
    value: 'beta'
stages:
# ============================================
# Stage 1: Validate & Test (runs on all pushes and PRs)
# ============================================
- stage: Validate_and_Test
  displayName: 'Validate & Test'
  condition: true
  pool:
    name: 'covenant-build-pool'
  jobs:
  - job: Flutter_Test
    displayName: 'Flutter Analyze & Test'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Build Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "SigookApp Pipeline - Validate & Test"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Source Branch: $(Build.SourceBranch)"
          echo "Build Reason: $(Build.Reason)"
          echo "Working Directory: $(workingDirectory)"
          echo "========================================"
    - template: templates/flutter-setup.yml
      parameters:
        flutterVersion: '$(flutterVersion)'
    - task: CmdLine@2
      displayName: 'Flutter Analyze'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Running flutter analyze..."
          flutter analyze --no-fatal-infos
          echo "✅ Code analysis passed"
    - task: CmdLine@2
      displayName: 'Flutter Test'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Running flutter test..."
          flutter test
          echo "✅ All tests passed"
    - task: CmdLine@2
      displayName: 'Verify Build Configuration (Fast)'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "========================================"
          echo "Verifying compilation configuration..."
          echo "========================================"

          echo "Verifying Android build configuration..."
          flutter build apk --debug -t $(entryPoint) --dry-run
          echo "✅ Android build configuration valid"

          echo ""
          echo "========================================"
          echo "🎯 Compilation verification passed!"
          echo "========================================"
# ============================================
# Stage 2: Calculate Version (shared by Android and iOS)
# ============================================
# Version Name: YYYY.M.D (e.g., "2026.2.12")
# Android Version Code: YYYYMMDDHH - always increasing, below the 2100000000 cap
# iOS Build Number: YYYYMMDDHHMM - CFBundleVersion has no cap, so minute
#   precision keeps a same-hour dev + main upload from colliding in App Store Connect
# ============================================
- stage: Version
  displayName: 'Calculate Version'
  dependsOn: Validate_and_Test
  condition: and(succeeded(), eq(variables.isPR, false), or(eq(variables.isDev, true), eq(variables.isMain, true)))
  pool:
    name: 'covenant-build-pool'
  jobs:
  - job: Calculate
    displayName: 'Calculate App Version'
    steps:
    - checkout: none
    - task: Bash@3
      name: CalculateVersion
      displayName: 'Calculate App Version'
      inputs:
        targetType: 'inline'
        script: |
          APP_VERSION_NAME="$(date +%Y).$(date +%-m).$(date +%-d)"
          APP_VERSION_CODE=$(date +%Y%m%d%H)
          IOS_BUILD_NUMBER=$(date +%Y%m%d%H%M)

          echo "========================================"
          echo "App Version - $(environment)"
          echo "========================================"
          echo "Version Name:         ${APP_VERSION_NAME}"
          echo "Android Version Code: ${APP_VERSION_CODE}"
          echo "iOS Build Number:     ${IOS_BUILD_NUMBER}"
          echo "========================================"

          echo "##vso[task.setvariable variable=appVersionName;isOutput=true]${APP_VERSION_NAME}"
          echo "##vso[task.setvariable variable=appVersionCode;isOutput=true]${APP_VERSION_CODE}"
          echo "##vso[task.setvariable variable=iosBuildNumber;isOutput=true]${IOS_BUILD_NUMBER}"
# ============================================
# Stage 3: Build Android AAB (runs on merged PR to dev/main only)
# ============================================
- stage: Build_Android
  displayName: 'Build Android'
  dependsOn:
  - Validate_and_Test
  - Version
  condition: and(succeeded(), eq(variables.isPR, false), or(eq(variables.isDev, true), eq(variables.isMain, true)))
  pool:
    name: 'covenant-build-pool'
  variables:
  # Environment-specific variable group (staging for dev, production for main)
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    - group: SigookApp-Production
  - ${{ else }}:
    - group: SigookApp-Staging
  # Android signing credentials (always production)
  - group: SigookApp-Android
  jobs:
  - job: Build_AAB
    displayName: 'Build Android AAB'
    variables:
      appVersionName: $[ stageDependencies.Version.Calculate.outputs['CalculateVersion.appVersionName'] ]
      appVersionCode: $[ stageDependencies.Version.Calculate.outputs['CalculateVersion.appVersionCode'] ]
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: CmdLine@2
      displayName: 'Free Disk Space'
      continueOnError: true
      inputs:
        script: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          echo "=== Disk space after cleanup ==="
          df -h /
    # Download production keystore (always production signing)
    - task: DownloadSecureFile@1
      name: androidKeystore
      displayName: 'Download Android Keystore (Production)'
      inputs:
        secureFile: 'sigook.jks'
    - task: CmdLine@2
      displayName: 'Setup Keystore'
      inputs:
        script: |
          cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/$(KEYSTORE_FILE)
          echo "✅ Keystore copied: $(KEYSTORE_FILE)"
    # Configure caches before Flutter setup
    - task: Cache@2
      displayName: 'Cache Gradle'
      inputs:
        key: 'gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts | $(workingDirectory)/android/gradle/wrapper/gradle-wrapper.properties'
        restoreKeys: |
          gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts
          gradle | "$(Agent.OS)"
        path: $(HOME)/.gradle/caches
    - task: Cache@2
      displayName: 'Cache Flutter Packages'
      inputs:
        key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.yaml'
        restoreKeys: |
          pub | "$(Agent.OS)"
        path: $(HOME)/.pub-cache

    - template: templates/flutter-setup.yml
      parameters:
        flutterVersion: '$(flutterVersion)'
    - task: CmdLine@2
      displayName: 'Clean Android local.properties'
      continueOnError: true
      inputs:
        script: |
          cd $(workingDirectory)/android
          rm -f local.properties
          echo "✅ Cleaned local.properties"
    - task: CmdLine@2
      displayName: 'Accept Android SDK Licenses'
      continueOnError: true
      inputs:
        script: |
          rm -rf $ANDROID_HOME/ndk/.temp 2>/dev/null || true
          rm -rf $ANDROID_HOME/.temp 2>/dev/null || true
          yes | sdkmanager --licenses || true
          echo "✅ Android SDK licenses accepted"
    - task: CmdLine@2
      displayName: 'Install Android Platform SDK'
      inputs:
        script: |
          cd $(workingDirectory)/android

          # compileSdk/compileSdkMinor are read from build.gradle.kts so the agent
          # stays in sync whenever the app bumps them. From API 36.1 onwards the
          # platform hash carries the minor level (android-37.0), and a bare
          # 'android-37' package does not exist in any SDK repository.
          COMPILE_SDK=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          COMPILE_SDK_MINOR=$(grep -oP 'compileSdkMinor\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          if [ -z "$COMPILE_SDK" ]; then
            echo "ERROR: could not read compileSdk from app/build.gradle.kts"
            exit 1
          fi

          if [ -n "$COMPILE_SDK_MINOR" ]; then
            PLATFORM="android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}"
          else
            PLATFORM="android-${COMPILE_SDK}"
          fi
          echo "=== Installing platforms;${PLATFORM} ==="

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;${PLATFORM}"
          yes | "$SDKMANAGER" "build-tools;${COMPILE_SDK}.0.0" || echo "build-tools ${COMPILE_SDK}.0.0 unavailable, AGP will use its default"

          if [ ! -d "$ANDROID_HOME/platforms/${PLATFORM}" ]; then
            echo "ERROR: platforms/${PLATFORM} not present after install"
            "$SDKMANAGER" --list_installed || true
            exit 1
          fi
          echo "✅ Android platform ${PLATFORM} installed"
    - task: CmdLine@2
      displayName: 'Install and Configure Android NDK'
      inputs:
        script: |
          echo "=== Installing Android NDK ==="
          # Install specific NDK version that matches Flutter's requirements
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" || true

          # Wait for installation to complete
          sleep 5

          # Set ANDROID_NDK_HOME to the installed NDK
          NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK Path: $NDK_PATH"

          if [ -d "$NDK_PATH" ]; then
            echo "✅ NDK installed successfully"
            echo "##vso[task.setvariable variable=ANDROID_NDK_HOME]$NDK_PATH"
            ls -la "$NDK_PATH/"

            # Verify toolchains
            if [ -d "$NDK_PATH/toolchains/llvm/prebuilt" ]; then
              echo "✅ NDK toolchains found"
            else
              echo "⚠️ NDK toolchains not found at expected location"
            fi
          else
            echo "⚠️ NDK installation may have failed"
            echo "Checking available NDKs:"
            ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK directory found"
          fi
    # Verify Fastlane is available (pre-installed on VM)
    - script: |
        export GEM_HOME="/home/azureuser/gems"
        export PATH="$GEM_HOME/bin:$PATH"
        echo "Verifying Fastlane installation..."
        ruby --version
        bundle --version
        fastlane --version
      displayName: 'Verify Fastlane Installation'
    - task: CmdLine@2
      displayName: 'Build Android AAB'
      env:
        # Variables from SigookApp-Android variable group
        KEYSTORE_FILE: $(KEYSTORE_FILE)
        KEY_PASSWORD: $(KEY_PASSWORD)
        KEY_ALIAS: $(KEY_ALIAS)
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Building Android AAB..."
          echo "ANDROID_NDK_HOME: $(ANDROID_NDK_HOME)"
          echo "ANDROID_HOME: $ANDROID_HOME"

          # Remove key.properties to force use of environment variables
          if [ -f "android/key.properties" ]; then
            echo "Removing android/key.properties to use pipeline environment variables"
            rm android/key.properties
          fi

          # Debug: Print keystore signing configuration
          echo "=== Keystore Signing Configuration ==="
          echo "KEYSTORE_FILE: $KEYSTORE_FILE"
          echo "KEY_ALIAS: $KEY_ALIAS"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD} chars"
          echo "Keystore file exists at android/app/: $(ls -la android/app/$KEYSTORE_FILE 2>/dev/null || echo 'NOT FOUND')"
          echo "======================================"

          # Export NDK path for Flutter/Gradle
          export ANDROID_NDK_HOME="$(ANDROID_NDK_HOME)"

          # Verify NDK is available
          if [ -d "$ANDROID_NDK_HOME" ]; then
            echo "✅ Using NDK at: $ANDROID_NDK_HOME"
          else
            echo "⚠️ WARNING: NDK not found at $ANDROID_NDK_HOME"
            echo "Available NDKs:"
            ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK directory"
          fi

          # Validate auth scopes EXACTLY. An extra scope is as fatal as a
          # missing one: 'roles' is not granted to the native clients and
          # IdentityServer answers invalid_scope, which the app surfaces as a
          # generic "invalid credentials" message.
          EXPECTED_SCOPES="openid,profile,api1,offline_access"
          if [ "$(SCOPES)" != "$EXPECTED_SCOPES" ]; then
            echo "ERROR: SCOPES must be exactly <$EXPECTED_SCOPES>"
            echo "   got: <$(SCOPES)>"
            exit 1
          fi
          echo "SCOPES validated <$(SCOPES)>"

          VERSION_NAME="$(appVersionName)"
          VERSION_CODE="$(appVersionCode)"

          echo "Building with Version Name: ${VERSION_NAME}"
          echo "Building with Version Code: ${VERSION_CODE}"

          flutter build appbundle \
            -t $(entryPoint) \
            --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            --dart-define="ENVIRONMENT=$(environment)" \
            --dart-define="AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
            --dart-define="API_BASE_URL=$(API_BASE_URL)" \
            --dart-define="CLIENT_ID=$(CLIENT_ID)" \
            --dart-define="REDIRECT_URI=$(REDIRECT_URI)" \
            --dart-define="POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
            --dart-define="SCOPES=$(SCOPES)" \
            --dart-define="APP_NAME=$(APP_NAME)" \
            --dart-define="APP_INSIGHTS_CONNECTION_STRING=$(APP_INSIGHTS_CONNECTION_STRING)"

          echo "✅ Android AAB built successfully for $(environment)"
          echo "   Version: ${VERSION_NAME} (${VERSION_CODE})"
          ls -la build/app/outputs/bundle/release/
    - task: Bash@3
      displayName: 'Verify Android AAB Signing'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)'
        script: |
          echo "=== Verifying Android AAB Signing ==="
          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" | head -1)

          if [ -z "$AAB_PATH" ]; then
            echo "❌ ERROR: AAB file not found!"
            exit 1
          fi

          echo "AAB found: $AAB_PATH"

          # Verify the AAB is signed using jarsigner
          echo ""
          echo "=== Checking AAB signature with jarsigner ==="
          if jarsigner -verify -verbose -certs "$AAB_PATH" 2>&1 | head -50; then
            echo ""
            echo "✅ AAB signature verification passed"
          else
            echo "❌ ERROR: AAB signature verification failed!"
            exit 1
          fi

          # Additional verification: Check signing certificate details
          echo ""
          echo "=== Certificate Details ==="
          jarsigner -verify -verbose -certs "$AAB_PATH" 2>&1 | grep -A 5 "Certificate" | head -20

          echo ""
          echo "✅ Android AAB signing verification complete!"
    - task: Bash@3
      displayName: 'Prepare AAB Artifact'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)'
        script: |
          mkdir -p $(Build.ArtifactStagingDirectory)/android

          VERSION_NAME="$(appVersionName)"
          VERSION_CODE="$(appVersionCode)"

          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" | head -1)
          if [ -n "$AAB_PATH" ]; then
            # Artifact name includes version: sigook-staging-2026.2.5-12345.aab
            ARTIFACT_NAME="sigook-$(environment)-${VERSION_NAME}-${VERSION_CODE}.aab"
            cp "$AAB_PATH" "$(Build.ArtifactStagingDirectory)/android/${ARTIFACT_NAME}"
            echo "✅ AAB copied: ${ARTIFACT_NAME}"
            ls -la $(Build.ArtifactStagingDirectory)/android/
          else
            echo "❌ AAB not found!"
            find . -name "*.aab" 2>/dev/null || echo "No AABs found"
            exit 1
          fi
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Android AAB'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/android'
        ArtifactName: 'sigookapp-android-$(environment)'
        publishLocation: 'Container'
    - task: Bash@3
      displayName: 'Build Summary'
      inputs:
        targetType: 'inline'
        script: |
          VERSION_NAME="$(appVersionName)"
          VERSION_CODE="$(appVersionCode)"

          echo ""
          echo "========================================"
          echo "✅ Android Build Complete! ($(environment))"
          echo "========================================"
          echo "Version Name: ${VERSION_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "Artifact: sigookapp-android-$(environment)"
          echo "AAB: sigook-$(environment)-${VERSION_NAME}-${VERSION_CODE}.aab"
          echo "========================================"
# ============================================
# Stage 4: Build iOS IPA (runs on merged PR to dev/main only, hosted macOS)
# ============================================
- stage: Build_iOS
  displayName: 'Build iOS'
  dependsOn:
  - Validate_and_Test
  - Version
  condition: and(succeeded(), eq(variables.isPR, false), or(eq(variables.isDev, true), eq(variables.isMain, true)))
  pool:
    vmImage: '$(macosImage)'
  variables:
  # Environment-specific variable group (staging for dev, production for main)
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    - group: SigookApp-Production
  - ${{ else }}:
    - group: SigookApp-Staging
  # App Store Connect API key + match settings
  - group: SigookApp-iOS
  jobs:
  - job: Build_IPA
    displayName: 'Build iOS IPA'
    # Free-tier hosted jobs are capped at 60 minutes
    timeoutInMinutes: 60
    variables:
      appVersionName: $[ stageDependencies.Version.Calculate.outputs['CalculateVersion.appVersionName'] ]
      iosBuildNumber: $[ stageDependencies.Version.Calculate.outputs['CalculateVersion.iosBuildNumber'] ]
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Build Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "iOS Build - $(environment)"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Source Branch: $(Build.SourceBranch)"
          echo "Version Name: $(appVersionName)"
          echo "iOS Build Number: $(iosBuildNumber)"
          echo "match readonly: ${{ parameters.matchReadonly }}"
          echo "========================================"
    - script: |
        XCODE_APP="/Applications/Xcode_$(xcodeVersion).app"
        if [ ! -d "$XCODE_APP" ]; then
          echo "ERROR: $XCODE_APP not found on $(macosImage). Installed versions:"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"
        xcodebuild -version
      displayName: 'Select Xcode $(xcodeVersion)'
    - task: Cache@2
      displayName: 'Cache Flutter Packages'
      inputs:
        key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock'
        restoreKeys: |
          pub | "$(Agent.OS)"
        path: $(HOME)/.pub-cache
    - task: Cache@2
      displayName: 'Cache CocoaPods'
      inputs:
        key: 'pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile'
        restoreKeys: |
          pods | "$(Agent.OS)"
        path: $(HOME)/Library/Caches/CocoaPods
    - template: templates/flutter-setup.yml
      parameters:
        flutterVersion: '$(flutterVersion)'
    - template: templates/fastlane-setup.yml
      parameters:
        workingDirectory: '$(workingDirectory)'
    - task: CmdLine@2
      displayName: 'Flutter Pub Get'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub get
    - task: Bash@3
      displayName: 'Install CocoaPods Dependencies'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)/ios'
        script: |
          # Retries only transient GitHub/CDN failures; dependency-resolution
          # errors are deterministic and retrying them just burns minutes.
          attempt=1
          max_attempts=3
          while true; do
            if output="$(pod install 2>&1)"; then
              echo "$output"
              echo "✅ pod install succeeded (attempt $attempt)"
              break
            fi
            echo "$output"
            if ! echo "$output" | grep -qiE "timed out|timeout|502|503|could not connect|network is unreachable|failed to fetch|temporarily unavailable"; then
              echo "❌ pod install failed with a non-transient error - not retrying"
              exit 1
            fi
            if [ $attempt -ge $max_attempts ]; then
              echo "❌ pod install failed after $max_attempts attempts"
              exit 1
            fi
            echo "⚠️ transient pod install failure (attempt $attempt/$max_attempts), retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
    - task: CmdLine@2
      displayName: 'Build iOS IPA (fastlane ios build)'
      env:
        # Secret variables are never exposed as environment variables implicitly
        APP_STORE_CONNECT_API_KEY: $(APP_STORE_CONNECT_API_KEY)
        MATCH_PASSWORD: $(MATCH_PASSWORD)
        # Lets match push/pull the signing repo in Azure Repos without a PAT
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        FASTLANE_SKIP_UPDATE_CHECK: "true"
      inputs:
        script: |
          cd $(workingDirectory)

          # Validate auth scopes EXACTLY. An extra scope is as fatal as a
          # missing one: 'roles' is not granted to the native clients and
          # IdentityServer answers invalid_scope, which the app surfaces as a
          # generic "invalid credentials" message.
          EXPECTED_SCOPES="openid,profile,api1,offline_access"
          if [ "$(SCOPES)" != "$EXPECTED_SCOPES" ]; then
            echo "ERROR: SCOPES must be exactly <$EXPECTED_SCOPES>"
            echo "   got: <$(SCOPES)>"
            exit 1
          fi
          echo "SCOPES validated <$(SCOPES)>"

          bundle exec fastlane ios build \
            entry_point:"$(entryPoint)" \
            version:"$(appVersionName)" \
            build_number:"$(iosBuildNumber)" \
            match_readonly:"${{ parameters.matchReadonly }}"

          echo "✅ iOS IPA built successfully for $(environment)"
          ls -la build/ios/ipa/
    - task: Bash@3
      displayName: 'Prepare IPA Artifact'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)'
        script: |
          mkdir -p $(Build.ArtifactStagingDirectory)/ios

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -n "$IPA_PATH" ]; then
            ARTIFACT_NAME="sigook-$(environment)-$(appVersionName)-$(iosBuildNumber).ipa"
            cp "$IPA_PATH" "$(Build.ArtifactStagingDirectory)/ios/${ARTIFACT_NAME}"
            echo "✅ IPA copied: ${ARTIFACT_NAME}"
            ls -la $(Build.ArtifactStagingDirectory)/ios/
          else
            echo "❌ IPA not found!"
            find . -name "*.ipa" 2>/dev/null || echo "No IPAs found"
            exit 1
          fi
    - task: PublishBuildArtifacts@1
      displayName: 'Publish iOS IPA'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios'
        ArtifactName: 'sigookapp-ios-$(environment)'
        publishLocation: 'Container'
# ============================================
# Stage 5: Deploy Android to Google Play (runs on merged PR to dev/main only)
# ============================================
- stage: Deploy_Android_PlayStore
  displayName: 'Deploy Android to Google Play'
  dependsOn:
  - Build_Android
  condition: and(succeeded(), eq(variables.isPR, false), or(eq(variables.isDev, true), eq(variables.isMain, true)))
  pool:
    name: 'covenant-build-pool'
  variables:
  # Environment-specific variable group (contains GOOGLE_PLAY_JSON_KEY)
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    - group: SigookApp-Production
  - ${{ else }}:
    - group: SigookApp-Staging
  jobs:
  - job: Deploy_PlayStore
    displayName: 'Deploy to Google Play ($(playTrack))'
    continueOnError: true  # Don't fail pipeline if deployment fails
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Deploy Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "Deploy Android to Google Play - $(environment)"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Environment: $(environment)"
          echo "Track: $(playTrack)"
          echo "========================================"
    - task: DownloadBuildArtifacts@1
      displayName: 'Download AAB Artifact'
      continueOnError: true
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'sigookapp-android-$(environment)'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Verify Fastlane is available (pre-installed on VM)
    - script: |
        export GEM_HOME="/home/azureuser/gems"
        export PATH="$GEM_HOME/bin:$PATH"
        echo "Verifying Fastlane installation..."
        ruby --version
        bundle --version
        fastlane --version
      displayName: 'Verify Fastlane Installation'
      continueOnError: true

    - task: CmdLine@2
      displayName: 'Deploy to Google Play'
      continueOnError: true
      env:
        GOOGLE_PLAY_JSON_KEY: $(GOOGLE_PLAY_JSON_KEY)
        FASTLANE_SKIP_UPDATE_CHECK: "true"
      inputs:
        script: |
          cd $(System.DefaultWorkingDirectory)/SigookApp
          AAB_PATH=$(find $(System.ArtifactsDirectory) -name "*.aab" | head -1)
          echo "Found AAB: $AAB_PATH"
          echo "Environment: $(environment)"
          export GEM_HOME="/home/azureuser/gems"
          export PATH="$GEM_HOME/bin:$PATH"
          if [ -n "$AAB_PATH" ]; then
            fastlane android deploy aab:"$AAB_PATH" track:$(playTrack) && echo "##vso[task.setvariable variable=deployStatus]success" || echo "##vso[task.setvariable variable=deployStatus]failed"
          else
            echo "⚠️ AAB not found, skipping deployment"
            echo "##vso[task.setvariable variable=deployStatus]skipped"
          fi
    - task: Bash@3
      displayName: 'Deploy Summary'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          echo ""
          echo "========================================"
          echo "Google Play Deployment Summary"
          echo "========================================"
          echo "Build ID: $(Build.BuildId)"
          echo "Environment: $(environment)"
          echo "Track: $(playTrack)"
          echo "Status: $(deployStatus)"
          echo "========================================"
# ============================================
# Stage 6: Deploy iOS to App Store Connect (runs on merged PR to dev/main only, hosted macOS)
# ============================================
- stage: Deploy_iOS
  displayName: 'Deploy iOS to App Store Connect'
  dependsOn:
  - Build_iOS
  condition: and(succeeded(), eq(variables.isPR, false), or(eq(variables.isDev, true), eq(variables.isMain, true)))
  pool:
    vmImage: '$(macosImage)'
  variables:
  - group: SigookApp-iOS
  jobs:
  - job: Deploy_AppStoreConnect
    displayName: 'Deploy to App Store Connect ($(iosLane))'
    continueOnError: true  # Don't fail pipeline if deployment fails
    timeoutInMinutes: 60
    variables:
      appVersionName: $[ stageDependencies.Version.Calculate.outputs['CalculateVersion.appVersionName'] ]
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Deploy Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "Deploy iOS to App Store Connect - $(environment)"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Environment: $(environment)"
          echo "Lane: $(iosLane)"
          echo "Version: $(appVersionName)"
          echo "========================================"
    - task: DownloadBuildArtifacts@1
      displayName: 'Download IPA Artifact'
      continueOnError: true
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'sigookapp-ios-$(environment)'
        downloadPath: '$(System.ArtifactsDirectory)'
    - template: templates/fastlane-setup.yml
      parameters:
        workingDirectory: '$(workingDirectory)'
        continueOnError: true
    - task: CmdLine@2
      displayName: 'Deploy to App Store Connect'
      continueOnError: true
      env:
        APP_STORE_CONNECT_API_KEY: $(APP_STORE_CONNECT_API_KEY)
        FASTLANE_SKIP_UPDATE_CHECK: "true"
      inputs:
        script: |
          cd $(workingDirectory)
          IPA_PATH=$(find $(System.ArtifactsDirectory) -name "*.ipa" | head -1)
          echo "Found IPA: $IPA_PATH"
          echo "Environment: $(environment)"
          if [ -n "$IPA_PATH" ]; then
            bundle exec fastlane ios $(iosLane) ipa:"$IPA_PATH" version:"$(appVersionName)" && echo "##vso[task.setvariable variable=deployStatus]success" || echo "##vso[task.setvariable variable=deployStatus]failed"
          else
            echo "⚠️ IPA not found, skipping deployment"
            echo "##vso[task.setvariable variable=deployStatus]skipped"
          fi
    - task: Bash@3
      displayName: 'Deploy Summary'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          echo ""
          echo "========================================"
          echo "App Store Connect Deployment Summary"
          echo "========================================"
          echo "Build ID: $(Build.BuildId)"
          echo "Environment: $(environment)"
          echo "Lane: $(iosLane)"
          echo "Status: $(deployStatus)"
          echo "========================================"

# ============================================
# Stage 7: Notify Production Deployment
# ============================================
- stage: Notify
  displayName: 'Notify Production Deploy'
  dependsOn:
  - Deploy_Android_PlayStore
  - Deploy_iOS
  condition: and(succeeded(), eq(variables.isMain, true))
  pool:
    name: 'covenant-build-pool'
  jobs:
  - job: SendEmail
    displayName: 'Send Deployment Email'
    variables:
    - group: Sigook-Notifications
    - name: appVersionName
      value: $[ stageDependencies.Version.Calculate.outputs['CalculateVersion.appVersionName'] ]
    steps:
    - checkout: none
    - template: templates/notify-deployment.yml
      parameters:
        appType: 'mobile'
        recipients: '$(NotificationRecipients)'
        version: '$(appVersionName)'
