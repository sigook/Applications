name: SigookApp-$(Date:yyyyMMdd)$(Rev:.r)
trigger:
  branches:
    include:
    - main
    - dev
    - SigookApp
  paths:
    include:
    - SigookApp/**
    - .azure-pipelines/sigookapp-pipeline.yml
    - .azure-pipelines/templates/flutter-setup.yml
    exclude:
    - SigookApp/README.md
    - SigookApp/docs/**
    - SigookApp/**/*.md
pr:
  branches:
    include:
    - dev
  paths:
    include:
    - SigookApp/**
    - .azure-pipelines/sigookapp-pipeline.yml
    exclude:
    - SigookApp/README.md
    - SigookApp/docs/**
variables:
- name: workingDirectory
  value: '$(System.DefaultWorkingDirectory)/SigookApp'
- name: isMain
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main','main')]
- name: isDev
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
- name: isSigookApp
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/SigookApp','SigookApp')]
- name: isPR
  value: $[eq(variables['Build.Reason'], 'PullRequest')]
- name: flutterVersion
  value: 'stable'
stages:
- stage: Validate_and_Test
  displayName: 'Validate & Test'
  condition: false
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Flutter_Test
    displayName: 'Flutter Analyze & Test'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Build Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "SigookApp Pipeline - Validate & Test"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Source Branch: $(Build.SourceBranch)"
          echo "Build Reason: $(Build.Reason)"
          echo "Working Directory: $(workingDirectory)"
          echo "========================================"
    - task: FlutterInstall@0
      displayName: 'Install Flutter SDK'
      inputs:
        mode: 'auto'
        channel: '$(flutterVersion)'
        version: 'latest'
    - task: CmdLine@2
      displayName: 'Flutter Doctor'
      inputs:
        script: |
          flutter --version
          flutter doctor -v
    - task: CmdLine@2
      displayName: 'Flutter Pub Get'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub get
    - task: CmdLine@2
      displayName: 'Run Build Runner'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Running build_runner..."
          flutter pub run build_runner build --delete-conflicting-outputs
          echo "✅ Code generation completed"
    - task: CmdLine@2
      displayName: 'Flutter Analyze'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Running flutter analyze..."
          flutter analyze --no-fatal-infos
          echo "✅ Code analysis passed"
    - task: CmdLine@2
      displayName: 'Flutter Test'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Running flutter test..."
          flutter test --coverage --machine > test-results.json || true
          echo "✅ Tests completed"
    - task: Bash@3
      displayName: 'Test Summary'
      inputs:
        targetType: 'inline'
        script: |
          cd $(workingDirectory)
          if [ -f "test-results.json" ]; then
            echo "Test results generated"
            cat test-results.json | head -100
          else
            echo "No test results file found"
          fi
          echo ""
          echo "✅ Validation stage completed!"
- stage: Build_Android_Staging
  displayName: 'Build Android (Staging)'
  dependsOn: []
  condition: false
  pool:
    vmImage: 'ubuntu-latest'
  variables:
  - group: SigookApp-Staging
  - group: App Configuration Staging
  - group: SigookApp-Android-Signing
  jobs:
  - job: Build_AAB_Staging
    displayName: 'Build Staging AAB'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Build Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "Android Staging Build"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Source Branch: $(Build.SourceBranch)"
          echo "========================================"
    - task: CmdLine@2
      displayName: 'Free Disk Space'
      continueOnError: true
      inputs:
        script: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          echo "=== Disk space after cleanup ==="
          df -h /
    - task: DownloadSecureFile@1
      name: androidKeystore
      displayName: 'Download Android Keystore'
      inputs:
        secureFile: 'upload-keystore.jks'
    - task: CmdLine@2
      displayName: 'Setup Keystore'
      inputs:
        script: |
          cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/upload-keystore.jks
          echo "✅ Keystore copied"
    - task: FlutterInstall@0
      displayName: 'Install Flutter SDK'
      inputs:
        mode: 'auto'
        channel: '$(flutterVersion)'
        version: 'latest'
    - task: CmdLine@2
      displayName: 'Flutter Pub Get'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub get
    - task: Cache@2
      displayName: 'Cache Gradle'
      inputs:
        key: 'gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts | $(workingDirectory)/android/gradle/wrapper/gradle-wrapper.properties'
        restoreKeys: |
          gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts
          gradle | "$(Agent.OS)"
        path: $(HOME)/.gradle/caches
    - task: Cache@2
      displayName: 'Cache Flutter Packages'
      inputs:
        key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock | $(workingDirectory)/pubspec.yaml'
        restoreKeys: |
          pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock
          pub | "$(Agent.OS)"
        path: $(HOME)/.pub-cache
    - task: CmdLine@2
      displayName: 'Run Build Runner'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub run build_runner build --delete-conflicting-outputs
    - task: CmdLine@2
      displayName: 'Clean Android local.properties'
      continueOnError: true
      inputs:
        script: |
          cd $(workingDirectory)/android
          rm -f local.properties
          echo "✅ Cleaned local.properties"
    - task: CmdLine@2
      displayName: 'Accept Android SDK Licenses'
      continueOnError: true
      inputs:
        script: |
          rm -rf $ANDROID_HOME/ndk/.temp 2>/dev/null || true
          rm -rf $ANDROID_HOME/.temp 2>/dev/null || true
          yes | sdkmanager --licenses || true
          echo "✅ Android SDK licenses accepted"
    - task: CmdLine@2
      displayName: 'Install and Configure Android NDK'
      inputs:
        script: |
          echo "=== Installing Android NDK ==="
          # Install specific NDK version that matches Flutter's requirements
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" || true

          # Wait for installation to complete
          sleep 5

          # Set ANDROID_NDK_HOME to the installed NDK
          NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK Path: $NDK_PATH"

          if [ -d "$NDK_PATH" ]; then
            echo "✅ NDK installed successfully"
            echo "##vso[task.setvariable variable=ANDROID_NDK_HOME]$NDK_PATH"
            ls -la "$NDK_PATH/"

            # Verify toolchains
            if [ -d "$NDK_PATH/toolchains/llvm/prebuilt" ]; then
              echo "✅ NDK toolchains found"
            else
              echo "⚠️ NDK toolchains not found at expected location"
            fi
          else
            echo "⚠️ NDK installation may have failed"
            echo "Checking available NDKs:"
            ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK directory found"
          fi
    - task: CmdLine@2
      displayName: 'Install Fastlane'
      inputs:
        script: |
          cd $(workingDirectory)
          sudo gem install fastlane -NV
          echo "✅ Fastlane installed"
    - task: CmdLine@2
      displayName: 'Run Flutter Tests'
      continueOnError: true
      inputs:
        script: |
          cd $(workingDirectory)
          flutter test --machine --coverage > test-results.json || echo "Tests completed with warnings"
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      continueOnError: true
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(workingDirectory)/test-results.json'
        failTaskOnFailedTests: false
    - task: CmdLine@2
      displayName: 'Build Android AAB'
      env:
        KEYSTORE_FILE: upload-keystore.jks
        KEY_PASSWORD: $(KEY_PASSWORD)
        KEY_ALIAS: sigook
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Building Android AAB..."
          echo "ANDROID_NDK_HOME: $(ANDROID_NDK_HOME)"
          echo "ANDROID_HOME: $ANDROID_HOME"

          # Remove key.properties to force use of environment variables
          if [ -f "android/key.properties" ]; then
            echo "Removing android/key.properties to use pipeline environment variables"
            rm android/key.properties
          fi

          # Debug: Print keystore signing configuration
          echo "=== Keystore Signing Configuration ==="
          echo "KEYSTORE_FILE: $KEYSTORE_FILE"
          echo "KEY_ALIAS: $KEY_ALIAS"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD} chars"
          echo "Keystore file exists at android/app/: $(ls -la android/app/upload-keystore.jks 2>/dev/null || echo 'NOT FOUND')"
          echo "======================================"

          # Export NDK path for Flutter/Gradle
          export ANDROID_NDK_HOME="$(ANDROID_NDK_HOME)"

          # Verify NDK is available
          if [ -d "$ANDROID_NDK_HOME" ]; then
            echo "✅ Using NDK at: $ANDROID_NDK_HOME"
          else
            echo "⚠️ WARNING: NDK not found at $ANDROID_NDK_HOME"
            echo "Available NDKs:"
            ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK directory"
          fi

          flutter build appbundle \
            --flavor staging \
            -t lib/main_staging.dart \
            --release \
            --build-number=$(Build.BuildId) \
            --dart-define=ENVIRONMENT=staging \
            "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
            "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
            "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
            "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
            "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
            "--dart-define=SCOPES=$(SCOPES)" \
            "--dart-define=APP_NAME=$(APP_NAME)"

          echo "✅ Android AAB built successfully"
          ls -la build/app/outputs/bundle/stagingRelease/
    - task: Bash@3
      displayName: 'Prepare AAB Artifact'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)'
        script: |
          mkdir -p $(Build.ArtifactStagingDirectory)/android

          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" | head -1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" $(Build.ArtifactStagingDirectory)/android/sigook-staging-$(Build.BuildId).aab
            echo "✅ AAB copied: sigook-staging-$(Build.BuildId).aab"
            ls -la $(Build.ArtifactStagingDirectory)/android/
          else
            echo "❌ AAB not found!"
            find . -name "*.aab" 2>/dev/null || echo "No AABs found"
            exit 1
          fi
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Staging AAB'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/android'
        ArtifactName: 'sigookapp-android-staging'
        publishLocation: 'Container'
    - task: Bash@3
      displayName: 'Build Summary'
      inputs:
        targetType: 'inline'
        script: |
          echo ""
          echo "========================================"
          echo "✅ Staging Android Build Complete!"
          echo "========================================"
          echo "Artifact: sigookapp-android-staging"
          echo "AAB: sigook-staging-$(Build.BuildId).aab"
          echo "Build ID: $(Build.BuildId)"
          echo "========================================"
- stage: Build_iOS_Staging
  displayName: 'Build iOS (Staging)'
  dependsOn: []
  condition: true
  pool:
    vmImage: 'macos-14'
  variables:
  - group: SigookApp-Staging
  - group: SigookApp-iOS-Signing
  jobs:
  - job: Build_IPA_Staging
    displayName: 'Build Staging IPA'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Build Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "iOS Staging Build"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "Source Branch: $(Build.SourceBranch)"
          echo "========================================"
    - task: CmdLine@2
      displayName: 'Cleanup signing keychain'
      inputs:
        script: |
          security delete-keychain ios_signing_temp.keychain || true
    - task: InstallAppleCertificate@2
      displayName: 'Install Apple Certificate'
      inputs:
        certSecureFile: 'new-distribution.p12'
        certPwd: '$(SIGOOK-DISTRIBUTION-PASSWORD)'
        keychain: 'temp'
    - task: InstallAppleProvisioningProfile@1
      name: installProvisioningProfile
      displayName: 'Install Provisioning Profile'
      inputs:
        provisioningProfileLocation: 'secureFiles'
        provProfileSecureFile: '$(PROVISIONING_PROFILE)'
        removeProfile: true
    - task: CmdLine@2
      displayName: 'Debug: List Provisioning Profiles'
      continueOnError: true
      inputs:
        script: |
          echo "=== Installed Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo ""
          echo "=== Profile Details ==="
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "Profile: $profile"
            security cms -D -i "$profile" | grep -A 1 "Name\|UUID\|TeamIdentifier\|TeamName" || true
            echo "---"
          done
          echo "==============================="
    - task: FlutterInstall@0
      displayName: 'Install Flutter SDK'
      inputs:
        mode: 'auto'
        channel: '$(flutterVersion)'
        version: 'latest'
    - task: CmdLine@2
      displayName: 'Flutter Pub Get'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub get
    - task: Cache@2
      displayName: 'Cache CocoaPods'
      continueOnError: true
      inputs:
        key: 'pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile | $(flutterVersion)'
        restoreKeys: |
          pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile
          pods | "$(Agent.OS)"
        path: $(workingDirectory)/ios/Pods
    - task: Cache@2
      displayName: 'Cache Xcode DerivedData'
      continueOnError: true
      inputs:
        key: 'deriveddata | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile | $(Build.SourceVersion)'
        restoreKeys: |
          deriveddata | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile
          deriveddata | "$(Agent.OS)"
        path: ~/Library/Developer/Xcode/DerivedData
    - task: Cache@2
      displayName: 'Cache Flutter Packages'
      inputs:
        key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock | $(workingDirectory)/pubspec.yaml'
        restoreKeys: |
          pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock
          pub | "$(Agent.OS)"
        path: $(HOME)/.pub-cache
    - task: CmdLine@2
      displayName: 'Run Build Runner'
      inputs:
        script: |
          cd $(workingDirectory)
          flutter pub run build_runner build --delete-conflicting-outputs
    - task: CmdLine@2
      displayName: 'Install CocoaPods'
      continueOnError: true
      inputs:
        script: |
          cd $(workingDirectory)/ios
          pod install
          echo "✅ CocoaPods dependencies installed"
    - task: CmdLine@2
      displayName: 'Debug: Installed Signing Identities'
      continueOnError: true
      inputs:
        script: |
          echo "=== Code Signing Identities ==="
          security find-identity -v -p codesigning
          echo "==============================="
    - task: CmdLine@2
      displayName: 'Install Fastlane'
      inputs:
        script: |
          cd $(workingDirectory)
          sudo gem install fastlane -NV
          sudo gem install cocoapods -NV
          echo "✅ Fastlane and CocoaPods installed"
    - task: CmdLine@2
      displayName: 'Run Flutter Tests'
      continueOnError: true
      inputs:
        script: |
          cd $(workingDirectory)
          flutter test --machine --coverage > test-results.json || echo "Tests completed with warnings"
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      continueOnError: true
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(workingDirectory)/test-results.json'
        failTaskOnFailedTests: false
    - task: CmdLine@2
      displayName: 'Flutter Build iOS (No Codesign)'
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Running Flutter build for iOS..."
          flutter build ios \
            -t lib/main_staging.dart \
            --release \
            --no-codesign \
            --build-number=$(Build.BuildId) \
            --dart-define=ENVIRONMENT=staging \
            "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
            "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
            "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
            "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
            "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
            "--dart-define=SCOPES=$(SCOPES)" \
            "--dart-define=APP_NAME=$(APP_NAME)"
          echo "✅ Flutter iOS build complete (no codesign)"
    - task: CmdLine@2
      displayName: 'Select Xcode Version'
      inputs:
        script: |
          echo "Selecting Xcode 16.1..."
          sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version
          echo "✅ Xcode 16.1 selected"
    - task: CmdLine@2
      displayName: 'Fastlane Archive & Sign'
      env:
        FASTLANE_SKIP_UPDATE_CHECK: "true"
        FASTLANE_HIDE_CHANGELOG: "true"
      inputs:
        script: |
          cd $(workingDirectory)
          echo "Building and signing IPA with fastlane..."
          fastlane ios beta
          echo "✅ Fastlane build complete"
    - task: Bash@3
      displayName: 'Prepare IPA Artifact'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(workingDirectory)'
        script: |
          mkdir -p $(Build.ArtifactStagingDirectory)/ios

          echo "Output directory contents:"
          ls -la output/ || true

          IPA_PATH=$(find output -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "$IPA_PATH" ]; then
            cp "$IPA_PATH" $(Build.ArtifactStagingDirectory)/ios/sigook-staging-$(Build.BuildId).ipa
            echo "✅ IPA copied: sigook-staging-$(Build.BuildId).ipa"
            ls -la $(Build.ArtifactStagingDirectory)/ios/
          else
            echo "❌ IPA not found!"
            find . -name "*.ipa" 2>/dev/null || echo "No IPAs found"
            exit 1
          fi
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Staging IPA'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios'
        ArtifactName: 'sigookapp-ios-staging'
        publishLocation: 'Container'
    - task: Bash@3
      displayName: 'Build Summary'
      inputs:
        targetType: 'inline'
        script: |
          echo ""
          echo "========================================"
          echo "✅ Staging iOS Build Complete!"
          echo "========================================"
          echo "Artifact: sigookapp-ios-staging"
          echo "IPA: sigook-staging-$(Build.BuildId).ipa"
          echo "Build ID: $(Build.BuildId)"
          echo "========================================"
- stage: Deploy_iOS_TestFlight
  displayName: 'Deploy iOS to TestFlight'
  dependsOn:
  - Build_iOS_Staging
  condition: false
  pool:
    vmImage: 'macos-14'
  variables:
  - group: SigookApp-Staging
  - group: SigookApp-iOS-Signing
  jobs:
  - job: Deploy_TestFlight
    displayName: 'Deploy to TestFlight'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Deploy Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "Deploy iOS to TestFlight"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "========================================"
    - task: DownloadBuildArtifacts@1
      displayName: 'Download IPA Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'sigookapp-ios-staging'
        downloadPath: '$(System.ArtifactsDirectory)'
    - task: CmdLine@2
      displayName: 'Install Fastlane'
      inputs:
        script: |
          sudo gem install fastlane -NV
          echo "✅ Fastlane installed"
    - task: CmdLine@2
      displayName: 'Deploy to TestFlight'
      env:
        APP_STORE_CONNECT_API_KEY_ID: $(APP_STORE_CONNECT_API_KEY_ID)
        APP_STORE_CONNECT_API_ISSUER_ID: $(APP_STORE_CONNECT_API_ISSUER_ID)
        APP_STORE_CONNECT_API_KEY_CONTENT: $(APP_STORE_CONNECT_API_KEY_CONTENT)
        FASTLANE_SKIP_UPDATE_CHECK: "true"
      inputs:
        script: |
          cd $(System.DefaultWorkingDirectory)/SigookApp
          IPA_PATH=$(find $(System.ArtifactsDirectory) -name "*.ipa" | head -1)
          echo "Found IPA: $IPA_PATH"
          fastlane ios deploy ipa:"$IPA_PATH"
    - task: Bash@3
      displayName: 'Deploy Summary'
      inputs:
        targetType: 'inline'
        script: |
          echo ""
          echo "========================================"
          echo "✅ TestFlight Deployment Complete!"
          echo "========================================"
          echo "Build ID: $(Build.BuildId)"
          echo "========================================"
- stage: Deploy_Android_PlayStore
  displayName: 'Deploy Android to Google Play'
  dependsOn:
  - Build_Android_Staging
  condition: false
  pool:
    vmImage: 'ubuntu-latest'
  variables:
  - group: SigookApp-Staging
  jobs:
  - job: Deploy_PlayStore
    displayName: 'Deploy to Google Play'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: 'Checkout Repository'
      inputs:
        repository: self
    - task: Bash@3
      displayName: 'Display Deploy Information'
      inputs:
        targetType: 'inline'
        script: |
          echo "========================================"
          echo "Deploy Android to Google Play"
          echo "========================================"
          echo "Build Number: $(Build.BuildNumber)"
          echo "========================================"
    - task: DownloadBuildArtifacts@1
      displayName: 'Download AAB Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'sigookapp-android-staging'
        downloadPath: '$(System.ArtifactsDirectory)'
    - task: CmdLine@2
      displayName: 'Install Fastlane'
      inputs:
        script: |
          sudo gem install fastlane -NV
          echo "✅ Fastlane installed"
    - task: CmdLine@2
      displayName: 'Deploy to Google Play'
      env:
        GOOGLE_PLAY_JSON_KEY: $(GOOGLE_PLAY_JSON_KEY)
        FASTLANE_SKIP_UPDATE_CHECK: "true"
      inputs:
        script: |
          cd $(System.DefaultWorkingDirectory)/SigookApp
          AAB_PATH=$(find $(System.ArtifactsDirectory) -name "*.aab" | head -1)
          echo "Found AAB: $AAB_PATH"
          fastlane android deploy aab:"$AAB_PATH"
    - task: Bash@3
      displayName: 'Deploy Summary'
      inputs:
        targetType: 'inline'
        script: |
          echo ""
          echo "========================================"
          echo "✅ Google Play Deployment Complete!"
          echo "========================================"
          echo "Build ID: $(Build.BuildId)"
          echo "========================================"
