# Azure Pipeline for SigookApp (Flutter Mobile Application)
# Builds Android APK/AAB and iOS IPA for staging and production environments

name: SigookApp-$(Date:yyyyMMdd)$(Rev:.r)

# Only trigger when SigookApp files change
trigger:
  branches:
    include:
      - main
      - dev
      - SigookApp
  paths:
    include:
      - SigookApp/**
      - .azure-pipelines/sigookapp-pipeline.yml
      - .azure-pipelines/templates/flutter-setup.yml
    exclude:
      - SigookApp/README.md
      - SigookApp/docs/**
      - SigookApp/**/*.md

# PR trigger - only validate PRs to dev (not to main)
# PRs to main are trusted since dev is the quality gate
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - SigookApp/**
      - .azure-pipelines/sigookapp-pipeline.yml
    exclude:
      - SigookApp/README.md
      - SigookApp/docs/**

# Environment detection variables
variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/SigookApp'
  isMain: $[in(variables['Build.SourceBranch'], 'refs/heads/main','main','refs/heads/SigookApp','SigookApp')]
  isDev: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
  isPR: $[eq(variables['Build.Reason'], 'PullRequest')]
  flutterVersion: 'stable'

stages:
  # ============================================
  # Stage 1: Validate and Test
  # ============================================
  - stage: Validate_and_Test
    displayName: 'Validate & Test'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Flutter_Test
        displayName: 'Flutter Analyze & Test'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Display Build Information'
            inputs:
              targetType: 'inline'
              script: |
                echo "========================================"
                echo "SigookApp Pipeline - Validate & Test"
                echo "========================================"
                echo "Build Number: $(Build.BuildNumber)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "Build Reason: $(Build.Reason)"
                echo "Working Directory: $(workingDirectory)"
                echo "========================================"

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          - script: |
              flutter --version
              flutter doctor -v
            displayName: 'Flutter Doctor'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Run code generation
          - script: |
              cd $(workingDirectory)
              echo "Running build_runner..."
              flutter pub run build_runner build --delete-conflicting-outputs
              echo "✅ Code generation completed"
            displayName: 'Run Build Runner'

          # Analyze code
          - script: |
              cd $(workingDirectory)
              echo "Running flutter analyze..."
              flutter analyze --no-fatal-infos
              echo "✅ Code analysis passed"
            displayName: 'Flutter Analyze'

          # Run tests
          - script: |
              cd $(workingDirectory)
              echo "Running flutter test..."
              flutter test --coverage --machine > test-results.json || true
              echo "✅ Tests completed"
            displayName: 'Flutter Test'

          # Publish test results (if test output exists)
          - task: Bash@3
            displayName: 'Test Summary'
            inputs:
              targetType: 'inline'
              script: |
                cd $(workingDirectory)
                if [ -f "test-results.json" ]; then
                  echo "Test results generated"
                  cat test-results.json | head -100
                else
                  echo "No test results file found"
                fi
                echo ""
                echo "✅ Validation stage completed!"

  # ============================================
  # Stage 2: Build Android APK (Staging)
  # ============================================
  - stage: Build_Android_Staging
    displayName: 'Build Android (Staging)'
    dependsOn: Validate_and_Test
    condition: and(succeeded(), eq(variables['isDev'], true), ne(variables['isPR'], true))
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      - group: SigookApp-Staging  # Variable group with env vars
      - group: App Configuration Staging  # Keystore credentials
    jobs:
      - job: Build_APK_Staging
        displayName: 'Build Staging APK'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Free up disk space to avoid 95%+ usage warnings
          - script: |
              echo "=== Disk space before cleanup ==="
              df -h /
              sudo rm -rf /usr/share/dotnet
              sudo rm -rf /usr/local/lib/android/sdk/ndk
              sudo rm -rf /opt/ghc
              echo "=== Disk space after cleanup ==="
              df -h /
            displayName: 'Free Disk Space'

          # Download keystore from secure files
          - task: DownloadSecureFile@1
            name: androidKeystore
            displayName: 'Download Android Keystore'
            inputs:
              secureFile: 'development.keystore'

          # Copy keystore to android directory
          - script: |
              cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/development.keystore
              echo "✅ Keystore copied to android/app/"
            displayName: 'Setup Keystore'

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Cache Gradle dependencies
          - task: Cache@2
            displayName: 'Cache Gradle'
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(HOME)/.gradle/caches

          # Cache Flutter pub packages
          - task: Cache@2
            displayName: 'Cache Flutter Packages'
            inputs:
              key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock'
              restoreKeys: |
                pub | "$(Agent.OS)"
              path: $(HOME)/.pub-cache

          # Run code generation
          - script: |
              cd $(workingDirectory)
              flutter pub run build_runner build --delete-conflicting-outputs
            displayName: 'Run Build Runner'

          # Clean local.properties (contains local machine paths)
          - script: |
              cd $(workingDirectory)/android
              rm -f local.properties
              echo "✅ Cleaned local.properties"
            displayName: 'Clean Android local.properties'

          # Create placeholder .env files (required as assets in pubspec.yaml)
          - script: |
              cd $(workingDirectory)
              echo "# CI environment - using --dart-define instead" > .env.staging
              echo "# CI environment - using --dart-define instead" > .env.production
              echo "✅ Created placeholder .env files"
            displayName: 'Create Placeholder .env Files'

          # Build staging APK with environment variables via --dart-define
          - script: |
              cd $(workingDirectory)
              echo "Building staging APK..."
              flutter build apk \
                --flavor staging \
                -t lib/main_staging.dart \
                --release \
                --dart-define=ENVIRONMENT=staging \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"
              echo "✅ Staging APK built successfully"
            displayName: 'Build Staging APK'
            env:
              KEYSTORE_FILE: development.keystore
              KEYSTORE_PASSWORD: $(android-keystore-password)
              KEY_PASSWORD: $(android-keystore-password)
              KEY_ALIAS: sigook

          # Copy APK to staging directory
          - task: Bash@3
            displayName: 'Prepare Artifacts'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(workingDirectory)'
              script: |
                echo "Current directory: $(pwd)"
                mkdir -p $(Build.ArtifactStagingDirectory)/android
                
                # Find and copy APK
                APK_PATH=$(find build/app/outputs/flutter-apk -name "*staging*.apk" | head -1)
                if [ -n "$APK_PATH" ]; then
                  cp "$APK_PATH" $(Build.ArtifactStagingDirectory)/android/sigook-staging-$(Build.BuildId).apk
                  echo "✅ APK copied: sigook-staging-$(Build.BuildId).apk"
                  ls -la $(Build.ArtifactStagingDirectory)/android/
                else
                  echo "❌ APK not found!"
                  echo "Searching for APKs..."
                  find . -name "*.apk" 2>/dev/null || echo "No APKs found"
                  exit 1
                fi

          # Publish APK artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Staging APK'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/android'
              ArtifactName: 'sigookapp-android-staging'
              publishLocation: 'Container'

          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "========================================"
                echo "✅ Staging Android Build Complete!"
                echo "========================================"
                echo "Artifact: sigookapp-android-staging"
                echo "APK: sigook-staging-$(Build.BuildId).apk"
                echo "Build ID: $(Build.BuildId)"
                echo "========================================"

  # ============================================
  # Stage 3: Build Android APK (Production)
  # ============================================
  - stage: Build_Android_Production
    displayName: 'Build Android (Production)'
    dependsOn: Validate_and_Test
    condition: and(succeeded(), eq(variables['isMain'], true), ne(variables['isPR'], true))
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      - group: SigookApp-Staging  # Variable group with env vars for beta
      - group: App Configuration Staging  # Keystore credentials
    jobs:
      - job: Build_APK_Production
        displayName: 'Build Production APK'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Free up disk space to avoid 95%+ usage warnings
          - script: |
              echo "=== Disk space before cleanup ==="
              df -h /
              sudo rm -rf /usr/share/dotnet
              sudo rm -rf /usr/local/lib/android/sdk/ndk
              sudo rm -rf /opt/ghc
              echo "=== Disk space after cleanup ==="
              df -h /
            displayName: 'Free Disk Space'

          # Download keystore from secure files
          - task: DownloadSecureFile@1
            name: androidKeystore
            displayName: 'Download Android Keystore'
            inputs:
              secureFile: 'development.keystore'

          # Copy keystore to android directory
          - script: |
              cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/development.keystore
              echo "✅ Keystore copied to android/app/"
            displayName: 'Setup Keystore'

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Cache Gradle dependencies
          - task: Cache@2
            displayName: 'Cache Gradle'
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: $(HOME)/.gradle/caches

          # Cache Flutter pub packages
          - task: Cache@2
            displayName: 'Cache Flutter Packages'
            inputs:
              key: 'pub | "$(Agent.OS)" | $(workingDirectory)/pubspec.lock'
              restoreKeys: |
                pub | "$(Agent.OS)"
              path: $(HOME)/.pub-cache

          # Run code generation
          - script: |
              cd $(workingDirectory)
              flutter pub run build_runner build --delete-conflicting-outputs
            displayName: 'Run Build Runner'

          # Clean local.properties (contains local machine paths)
          - script: |
              cd $(workingDirectory)/android
              rm -f local.properties
              echo "✅ Cleaned local.properties"
            displayName: 'Clean Android local.properties'

          # Create placeholder .env files (required as assets in pubspec.yaml)
          - script: |
              cd $(workingDirectory)
              echo "# CI environment - using --dart-define instead" > .env.staging
              echo "# CI environment - using --dart-define instead" > .env.production
              echo "✅ Created placeholder .env files"
            displayName: 'Create Placeholder .env Files'

          # Build production AAB with auto-incrementing version code
          # Note: APK build removed - Play Store only needs AAB
          # For local testing, use: flutter build apk --flavor production

          - script: |
              cd $(workingDirectory)
              echo "Building production AAB with version code: $(Build.BuildId)..."
              
              if flutter build appbundle \
                --flavor production \
                -t lib/main_production.dart \
                --release \
                --build-number=$(Build.BuildId) \
                --dart-define=ENVIRONMENT=production \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"; then
                
                echo "✅ Production AAB built successfully"
                echo "Verifying build output..."
                ls -la build/app/outputs/bundle/ || echo "Warning: bundle directory not found"
                find build/app/outputs -name "*.aab" || echo "Warning: No AAB found yet"
              else
                echo "❌ Flutter build appbundle failed with exit code $?"
                echo "Checking for build artifacts..."
                ls -la build/app/outputs/ || echo "No outputs directory"
                exit 1
              fi
            displayName: 'Build Production AAB (Play Store)'
            env:
              KEYSTORE_FILE: development.keystore
              KEYSTORE_PASSWORD: $(android-keystore-password)
              KEY_PASSWORD: $(android-keystore-password)
              KEY_ALIAS: sigook

          # Copy AAB artifact to staging directory
          - task: Bash@3
            displayName: 'Prepare AAB Artifact'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(workingDirectory)'
              script: |
                echo "Current directory: $(pwd)"
                mkdir -p $(Build.ArtifactStagingDirectory)/android
                
                # Find and copy AAB
                AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" | head -1)
                if [ -n "$AAB_PATH" ]; then
                  cp "$AAB_PATH" $(Build.ArtifactStagingDirectory)/android/sigook-production-$(Build.BuildId).aab
                  echo "✅ AAB copied: sigook-production-$(Build.BuildId).aab"
                  echo "Version Code: $(Build.BuildId)"
                else
                  echo "❌ AAB not found!"
                  echo "Searching for AABs..."
                  find . -name "*.aab" 2>/dev/null || echo "No AABs found"
                  exit 1
                fi
                
                ls -la $(Build.ArtifactStagingDirectory)/android/

          # Publish artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Production Android Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/android'
              ArtifactName: 'sigookapp-android-production'
              publishLocation: 'Container'

          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "========================================"
                echo "✅ Production Android Build Complete!"
                echo "========================================"
                echo "Branch: $(Build.SourceBranch)"
                echo "Artifact: sigookapp-android-production"
                echo "AAB: sigook-production-$(Build.BuildId).aab"
                echo "Version Code: $(Build.BuildId)"
                echo "Build ID: $(Build.BuildId)"
                echo "========================================"
                echo "Note: APK build removed for faster CI/CD"
                echo "For local APK testing, use:"
                echo "  flutter build apk --flavor production"
                echo "========================================"

  # ============================================
  # Stage 4: Deploy to Google Play Store
  # ============================================
  - stage: Deploy_PlayStore
    displayName: 'Deploy to Play Store'
    dependsOn: Build_Android_Production
    condition: and(succeeded(), eq(variables['isMain'], true))
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      - group: SigookApp-Production
    jobs:
      - deployment: DeployPlayStore
        displayName: 'Upload to Play Store'
        environment: 'PlayStore-Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'sigookapp-android-production'
                  displayName: 'Download Production AAB'

                - task: DownloadSecureFile@1
                  name: serviceAccountJson
                  displayName: 'Download Service Account JSON'
                  inputs:
                    secureFile: 'playstore-service-account.json'

                - task: GooglePlayRelease@4
                  displayName: 'Release to Play Store (Internal Track)'
                  inputs:
                    authType: 'JsonFile'
                    serviceAccountKey: '$(serviceAccountJson.secureFilePath)'
                    applicationId: 'com.sigook.beta'
                    action: 'SingleBundle'
                    bundleFile: '$(Pipeline.Workspace)/sigookapp-android-production/*.aab'
                    track: 'internal'
                    rolloutPercentage: 100
                    changeUpdatePriority: 2
                    releaseName: '$(Build.BuildNumber)'

                - task: Bash@3
                  displayName: 'Deployment Summary'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo ""
                      echo "========================================"
                      echo "✅ Play Store Deployment Complete!"
                      echo "========================================"
                      echo "Track: internal"
                      echo "Application ID: com.sigook.beta"
                      echo "Build: $(Build.BuildNumber)"
                      echo "AAB: $(Pipeline.Workspace)/sigookapp-android-production/*.aab"
                      echo "========================================"
                      echo ""
                      echo "📱 Next Steps:"
                      echo "1. Check Google Play Console for the release"
                      echo "2. Promote to alpha/beta when ready"
                      echo "3. Eventually promote to production"
                      echo "========================================"

  # ============================================
  # Stage 5: Build iOS IPA (Staging)
  # ============================================
  - stage: Build_iOS_Staging
    displayName: 'Build iOS (Staging)'
    dependsOn: Validate_and_Test
    condition: and(succeeded(), eq(variables['isDev'], true), ne(variables['isPR'], true))
    pool:
      vmImage: 'macos-latest'
    variables:
      - group: SigookApp-Staging
      - group: SigookApp-iOS-Signing
    jobs:
      - job: Build_IPA_Staging
        displayName: 'Build Staging IPA'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Display Build Information'
            inputs:
              targetType: 'inline'
              script: |
                echo "========================================"
                echo "iOS Staging Build"
                echo "========================================"
                echo "Build Number: $(Build.BuildNumber)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "========================================"

          # Install Apple Certificate
          - task: InstallAppleCertificate@2
            displayName: 'Install Apple Certificate'
            inputs:
              certSecureFile: IOSDistribution.p12
              certPwd: '$(P12_PASSWORD)'
              keychain: 'temp'
              deleteCert: true

          # Install Provisioning Profile
          - task: InstallAppleProvisioningProfile@1
            displayName: 'Install Provisioning Profile'
            inputs:
              provisioningProfileLocation: 'secureFiles'
              provProfileSecureFile: 'Sigook_Beta_Provision.mobileprovision'
              removeProfile: true

          # Download keystore from secure files
          - task: DownloadSecureFile@1
            name: androidKeystore
            displayName: 'Download Android Keystore'
            inputs:
              secureFile: 'development.keystore'

          # Copy keystore to android directory
          - script: |
              cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/sigook-release.keystore
              echo "✅ Keystore copied to android/app/sigook-release.keystore"
            displayName: 'Setup Keystore'

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Run code generation
          - script: |
              cd $(workingDirectory)
              flutter pub run build_runner build --delete-conflicting-outputs
            displayName: 'Run Build Runner'

          # Create placeholder .env files
          - script: |
              cd $(workingDirectory)
              echo "# CI environment - using --dart-define instead" > .env.staging
              echo "# CI environment - using --dart-define instead" > .env.production
              echo "✅ Created placeholder .env files"
            displayName: 'Create Placeholder .env Files'

          # Build staging IPA
          - script: |
              cd $(workingDirectory)
              echo "Building staging IPA..."
              
              if flutter build ipa \
                -t lib/main_staging.dart \
                --release \
                --export-options-plist=ios/ExportOptions-Staging.plist \
                --dart-define=ENVIRONMENT=staging \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"; then
                
                echo "✅ Staging IPA built successfully"
                echo "Verifying build output..."
                ls -la build/ios/ || echo "Warning: build/ios directory check failed"
                find build/ios -name "*.ipa" || echo "Warning: No IPA found yet"
              else
                echo "❌ Flutter build ipa failed with exit code $?"
                echo "Checking for build artifacts..."
                ls -la build/ || echo "No build directory"
                exit 1
              fi
            displayName: 'Build Staging IPA'

          # Copy IPA to staging directory
          - task: Bash@3
            displayName: 'Prepare IPA Artifact'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(workingDirectory)'
              script: |
                echo "Current directory: $(pwd)"
                mkdir -p $(Build.ArtifactStagingDirectory)/ios
                
                # Debug: Show build directory structure
                echo "Build directory contents:"
                ls -la build/ios/ || true
                
                # Find and copy IPA (Flutter build ipa creates files in build/ios/archive or build/ios/iphoneos)
                IPA_PATH=$(find build/ios -name "*.ipa" 2>/dev/null | head -1)
                if [ -n "$IPA_PATH" ]; then
                  cp "$IPA_PATH" $(Build.ArtifactStagingDirectory)/ios/sigook-staging-$(Build.BuildId).ipa
                  echo "✅ IPA copied from: $IPA_PATH"
                  echo "✅ IPA artifact: sigook-staging-$(Build.BuildId).ipa"
                else
                  echo "❌ IPA not found in build/ios/"
                  echo "Searching entire build directory:"
                  find build -name "*.ipa" 2>/dev/null || echo "No IPAs found anywhere"
                  echo "Checking for .xcarchive:"
                  find build/ios -name "*.xcarchive" 2>/dev/null || echo "No archives found"
                  exit 1
                fi
                
                ls -la $(Build.ArtifactStagingDirectory)/ios/

          # Publish IPA artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Staging IPA'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios'
              ArtifactName: 'sigookapp-ios-staging'
              publishLocation: 'Container'

          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "========================================"
                echo "✅ Staging iOS Build Complete!"
                echo "========================================"
                echo "Artifact: sigookapp-ios-staging"
                echo "IPA: sigook-staging-$(Build.BuildId).ipa"
                echo "Build ID: $(Build.BuildId)"
                echo "========================================"

  # ============================================
  # Stage 6: Build iOS IPA (Production)
  # ============================================
  - stage: Build_iOS_Production
    displayName: 'Build iOS (Production)'
    dependsOn: Validate_and_Test
    condition: and(succeeded(), eq(variables['isMain'], true), ne(variables['isPR'], true))
    pool:
      vmImage: 'macos-latest'
    variables:
      - group: SigookApp-Staging
      - group: SigookApp-iOS-Signing
    jobs:
      - job: Build_IPA_Production
        displayName: 'Build Production IPA'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Display Build Information'
            inputs:
              targetType: 'inline'
              script: |
                echo "========================================"
                echo "iOS Production Build"
                echo "========================================"
                echo "Build Number: $(Build.BuildNumber)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "========================================"

          # Install Apple Certificate
          - task: InstallAppleCertificate@2
            displayName: 'Install Apple Certificate'
            inputs:
              certSecureFile: 'IOSDistribution.p12'
              certPwd: '$(P12_PASSWORD)'
              keychain: 'temp'
              deleteCert: true

          # Install Provisioning Profile
          - task: InstallAppleProvisioningProfile@1
            displayName: 'Install Provisioning Profile'
            inputs:
              provisioningProfileLocation: 'secureFiles'
              provProfileSecureFile: 'Sigook_Beta_AppStore.mobileprovision'
              removeProfile: true

          # Download keystore from secure files
          - task: DownloadSecureFile@1
            name: androidKeystore
            displayName: 'Download Android Keystore'
            inputs:
              secureFile: 'development.keystore'

          # Copy keystore to android directory
          - script: |
              cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/sigook-release.keystore
              echo "✅ Keystore copied to android/app/sigook-release.keystore"
            displayName: 'Setup Keystore'

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Run code generation
          - script: |
              cd $(workingDirectory)
              flutter pub run build_runner build --delete-conflicting-outputs
            displayName: 'Run Build Runner'

          # Create placeholder .env files
          - script: |
              cd $(workingDirectory)
              echo "# CI environment - using --dart-define instead" > .env.staging
              echo "# CI environment - using --dart-define instead" > .env.production
              echo "✅ Created placeholder .env files"
            displayName: 'Create Placeholder .env Files'

          # Build iOS IPA (Production) with auto-incrementing build number
          - script: |
              cd $(workingDirectory)
              echo "Building production IPA with build number: $(Build.BuildId)..."
              
              if flutter build ipa \
                -t lib/main_production.dart \
                --release \
                --build-number=$(Build.BuildId) \
                --export-options-plist=ios/ExportOptions-Production.plist \
                --dart-define=ENVIRONMENT=production \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"; then
                
                echo "✅ Production IPA built successfully"
                echo "Verifying build output..."
                ls -la build/ios/ || echo "Warning: build/ios directory check failed"
                find build/ios -name "*.ipa" || echo "Warning: No IPA found yet"
              else
                echo "❌ Flutter build ipa failed with exit code $?"
                echo "Checking for build artifacts..."
                ls -la build/ || echo "No build directory"
                exit 1
              fi
            displayName: 'Build Production IPA (TestFlight)'

          # Copy IPA to staging directory
          - task: Bash@3
            displayName: 'Prepare IPA Artifact'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(workingDirectory)'
              script: |
                echo "Current directory: $(pwd)"
                mkdir -p $(Build.ArtifactStagingDirectory)/ios
                
                # Debug: Show build directory structure
                echo "Build directory contents:"
                ls -la build/ios/ || true
                
                # Find and copy IPA (Flutter build ipa creates files in build/ios/archive or build/ios/iphoneos)
                IPA_PATH=$(find build/ios -name "*.ipa" 2>/dev/null | head -1)
                if [ -n "$IPA_PATH" ]; then
                  cp "$IPA_PATH" $(Build.ArtifactStagingDirectory)/ios/sigook-production-$(Build.BuildId).ipa
                  echo "✅ IPA copied from: $IPA_PATH"
                  echo "✅ IPA artifact: sigook-production-$(Build.BuildId).ipa"
                  echo "Build Number: $(Build.BuildId)"
                else
                  echo "❌ IPA not found in build/ios/"
                  echo "Searching entire build directory:"
                  find build -name "*.ipa" 2>/dev/null || echo "No IPAs found anywhere"
                  echo "Checking for .xcarchive:"
                  find build/ios -name "*.xcarchive" 2>/dev/null || echo "No archives found"
                  exit 1
                fi
                
                ls -la $(Build.ArtifactStagingDirectory)/ios/

          # Publish IPA artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Production IPA'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios'
              ArtifactName: 'sigookapp-ios-production'
              publishLocation: 'Container'

          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "========================================"
                echo "✅ Production iOS Build Complete!"
                echo "========================================"
                echo "Branch: $(Build.SourceBranch)"
                echo "Artifact: sigookapp-ios-production"
                echo "IPA: sigook-production-$(Build.BuildId).ipa"
                echo "Build Number: $(Build.BuildId)"
                echo "Build ID: $(Build.BuildId)"
                echo "========================================"

  # ============================================
  # Stage 7: Deploy to TestFlight
  # ============================================
  - stage: Deploy_TestFlight
    displayName: 'Deploy to TestFlight'
    dependsOn: Build_iOS_Production
    condition: and(succeeded(), eq(variables['isMain'], true))
    pool:
      vmImage: 'macos-latest'
    variables:
      - group: SigookApp-Staging
      - group: SigookApp-iOS-Signing
    jobs:
      - deployment: DeployTestFlight
        displayName: 'Upload to TestFlight'
        environment: 'TestFlight-Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'sigookapp-ios-production'
                  displayName: 'Download Production IPA'

                # Install Apple Certificate (needed for validation)
                - task: InstallAppleCertificate@2
                  displayName: 'Install Apple Certificate'
                  inputs:
                    certSecureFile: 'IOSDistribution.p12'
                    certPwd: '$(P12_PASSWORD)'
                    keychain: 'temp'
                    deleteCert: true

                # Upload to TestFlight using App Store Connect API
                - task: AppStoreRelease@1
                  displayName: 'Upload to TestFlight'
                  inputs:
                    authType: 'ApiKey'
                    apiKeyId: '$(APP_STORE_CONNECT_API_KEY_ID)'
                    apiKeyIssuerId: '$(APP_STORE_CONNECT_ISSUER_ID)'
                    apitoken: '$(APP_STORE_CONNECT_API_KEY_CONTENT)'
                    releaseTrack: 'TestFlight'
                    ipaPath: '$(Pipeline.Workspace)/sigookapp-ios-production/*.ipa'
                    shouldSkipWaitingForProcessing: true
                    shouldSkipSubmission: false
                    appIdentifier: 'com.sigook.beta'
                    teamId: '$(APPLE_TEAM_ID)'
                    teamName: '$(APPLE_TEAM_NAME)'

                - task: Bash@3
                  displayName: 'Deployment Summary'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo ""
                      echo "========================================"
                      echo "✅ TestFlight Deployment Complete!"
                      echo "========================================"
                      echo "App ID: com.sigook.beta"
                      echo "Build: $(Build.BuildNumber)"
                      echo "Build Number: $(Build.BuildId)"
                      echo "IPA: $(Pipeline.Workspace)/sigookapp-ios-production/*.ipa"
                      echo "========================================"
                      echo ""
                      echo "📱 Next Steps:"
                      echo "1. Check App Store Connect for processing"
                      echo "2. Add external testers when build is ready"
                      echo "3. Submit for App Store review when stable"
                      echo "========================================"
