# Azure Pipeline for SigookApp (Flutter Mobile Application)
# Optimized version - Builds iOS IPA for staging environment
# Key optimizations:
# - Removed redundant steps (duplicate CocoaPods install, unnecessary debug steps)
# - Reordered steps for better efficiency (Xcode selection first, proper pod install order)
# - Removed conflicting cache strategies (DerivedData cache removed due to clear_derived_data in Fastfile)
# - Cleaned up placeholder .env files
# - Streamlined test execution

name: SigookApp-$(Date:yyyyMMdd)$(Rev:.r)

# Only trigger when SigookApp files change
trigger:
  branches:
    include:
      - main
      - dev
      - SigookApp
  paths:
    include:
      - SigookApp/**
      - .azure-pipelines/sigookapp-pipeline.yml
      - .azure-pipelines/templates/flutter-setup.yml
    exclude:
      - SigookApp/README.md
      - SigookApp/docs/**
      - SigookApp/**/*.md

# PR trigger - only validate PRs to dev (not to main)
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - SigookApp/**
      - .azure-pipelines/sigookapp-pipeline.yml
    exclude:
      - SigookApp/README.md
      - SigookApp/docs/**

# Environment detection variables
variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/SigookApp'
  isMain: $[in(variables['Build.SourceBranch'], 'refs/heads/main','main')]
  isDev: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
  isSigookApp: $[in(variables['Build.SourceBranch'], 'refs/heads/SigookApp','SigookApp')]
  isPR: $[eq(variables['Build.Reason'], 'PullRequest')]
  flutterVersion: 'stable'

stages:
  # ============================================
  # Stage 1: Build iOS (Staging) - OPTIMIZED
  # ============================================
  - stage: Build_iOS_Staging
    displayName: 'Build iOS (Staging)'
    dependsOn: []
    condition: and(succeeded(), eq(variables['isSigookApp'], true), ne(variables['isPR'], true))
    variables:
      - group: SigookApp-Staging
      - group: App Configuration Staging
    jobs:
      - job: Build_IPA_Staging
        displayName: 'Build Staging IPA'
        pool:
          vmImage: 'macOS-lastest'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Display Build Information'
            inputs:
              targetType: 'inline'
              script: |
                echo "========================================"
                echo "iOS Staging Build - OPTIMIZED"
                echo "========================================"
                echo "Build Number: $(Build.BuildNumber)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "Build Reason: $(Build.Reason)"
                echo "Working Directory: $(workingDirectory)"
                echo "========================================"

          # STEP 1: Pin Xcode version FIRST (before any build operations)
          - script: |
              echo "Selecting Xcode 15.4..."
              sudo xcode-select -s /Applications/Xcode_15.4.app
              xcodebuild -version
              echo "✅ Xcode 15.4 selected"
            displayName: 'Select Xcode Version'

          # STEP 2: Cleanup any existing signing keychain
          - script: |
              security delete-keychain ios_signing_temp.keychain || true
              echo "✅ Cleaned up existing keychain"
            displayName: 'Cleanup Signing Keychain'

          # STEP 3: Install Apple Certificate
          - task: InstallAppleCertificate@2
            displayName: 'Install Apple Certificate'
            inputs:
              certSecureFile: 'new-distribution.p12'
              certPwd: '$(SIGOOK-DISTRIBUTION-PASSWORD)'
              keychain: 'temp'

          # STEP 4: Install Provisioning Profile
          - task: InstallAppleProvisioningProfile@1
            displayName: 'Install Provisioning Profile'
            inputs:
              provisioningProfileLocation: 'secureFiles'
              provProfileSecureFile: '$(PROVISIONING_PROFILE)'
              removeProfile: true

          # STEP 5: Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # STEP 6: Verify Flutter installation
          - script: |
              flutter --version
              echo "✅ Flutter SDK ready"
            displayName: 'Verify Flutter'

          # STEP 7: Get Flutter dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
              echo "✅ Flutter dependencies installed"
            displayName: 'Flutter Pub Get'

          # STEP 8: Cache CocoaPods (only Pods, not DerivedData due to clear_derived_data in Fastfile)
          - task: Cache@2
            displayName: 'Cache CocoaPods'
            continueOnError: true
            inputs:
              key: 'pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile.lock | $(flutterVersion)'
              restoreKeys: |
                pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile.lock
                pods | "$(Agent.OS)"
              path: $(workingDirectory)/ios/Pods

          # STEP 9: Install CocoaPods dependencies
          - script: |
              cd $(workingDirectory)/ios
              pod install
              echo "✅ CocoaPods dependencies installed"
            displayName: 'Install CocoaPods'

          # STEP 10: Run code generation (build_runner)
          - script: |
              cd $(workingDirectory)
              echo "Running build_runner..."
              flutter pub run build_runner build --delete-conflicting-outputs
              echo "✅ Code generation completed"
            displayName: 'Run Build Runner'

          # STEP 11: Install Fastlane (no need to install CocoaPods again)
          - script: |
              sudo gem install fastlane -NV
              echo "✅ Fastlane installed"
            displayName: 'Install Fastlane'

          # STEP 12: Build iOS with Flutter (no codesign)
          - script: |
              cd $(workingDirectory)
              echo "Running Flutter build for iOS..."
              flutter build ios \
                -t lib/main_staging.dart \
                --release \
                --no-codesign \
                --dart-define=ENVIRONMENT=staging \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"
              echo "✅ Flutter iOS build complete (no codesign)"
            displayName: 'Flutter Build iOS'

          # STEP 13: Archive and sign with Fastlane
          - script: |
              cd $(workingDirectory)
              echo "Building and signing IPA with fastlane..."
              fastlane ios beta
              echo "✅ Fastlane build complete"
            displayName: 'Fastlane Archive & Sign'
            env:
              FASTLANE_SKIP_UPDATE_CHECK: "true"
              FASTLANE_HIDE_CHANGELOG: "true"

          # STEP 14: Prepare IPA artifact with improved debugging
          - task: Bash@3
            displayName: 'Prepare IPA Artifact'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(workingDirectory)'
              script: |
                echo "=== Debugging Output Directory ==="
                echo "Current directory: $(pwd)"
                echo ""
                echo "Directory structure:"
                ls -la . | grep -E "^d" || true
                echo ""
                
                if [ -d "output" ]; then
                  echo "✅ Output directory exists"
                  echo ""
                  echo "Contents of output/:"
                  ls -laR output/
                  echo ""
                else
                  echo "❌ Output directory does not exist!"
                  echo ""
                  echo "Searching for IPA files anywhere in workspace..."
                  find . -name "*.ipa" -type f 2>/dev/null || echo "No IPAs found"
                  echo ""
                  exit 1
                fi
                
                echo "=== Copying IPA to Artifact Staging ==="
                mkdir -p $(Build.ArtifactStagingDirectory)/ios
                
                IPA_PATH=$(find output -name "*.ipa" -type f 2>/dev/null | head -1)
                
                if [ -n "$IPA_PATH" ]; then
                  IPA_NAME="sigook-staging-$(Build.BuildId).ipa"
                  cp "$IPA_PATH" "$(Build.ArtifactStagingDirectory)/ios/$IPA_NAME"
                  
                  echo "✅ IPA copied successfully"
                  echo ""
                  echo "Artifact details:"
                  ls -lh "$(Build.ArtifactStagingDirectory)/ios/$IPA_NAME"
                  echo ""
                  echo "IPA size: $(du -h "$(Build.ArtifactStagingDirectory)/ios/$IPA_NAME" | cut -f1)"
                else
                  echo "❌ IPA file not found in output directory!"
                  echo ""
                  echo "Output directory contents:"
                  find output -type f 2>/dev/null || echo "Output directory is empty"
                  exit 1
                fi

          # STEP 15: Publish IPA artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Staging IPA'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios'
              ArtifactName: 'sigookapp-ios-staging'
              publishLocation: 'Container'

          # STEP 16: Build summary
          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "========================================"
                echo "✅ iOS Staging Build Complete!"
                echo "========================================"
                echo "Artifact: sigookapp-ios-staging"
                echo "IPA: sigook-staging-$(Build.BuildId).ipa"
                echo "Build ID: $(Build.BuildId)"
                echo "Build Number: $(Build.BuildNumber)"
                echo "========================================"
                echo ""
                echo "Next steps:"
                echo "1. Download the IPA from the Artifacts tab"
                echo "2. Upload to TestFlight via App Store Connect"
                echo "3. Distribute to beta testers"
                echo "========================================"

  # ============================================
  # Stage 2: Build Android AAB (Beta) - DISABLED
  # ============================================
  - stage: Build_Android_Staging
    displayName: 'Build Android (Staging)'
    dependsOn: []
    condition: false  # Temporarily disabled - focusing on iOS only
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      - group: SigookApp-Staging
      - group: App Configuration Staging
    jobs:
      - job: Build_AAB_Staging
        displayName: 'Build Staging AAB'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Display Build Information'
            inputs:
              targetType: 'inline'
              script: |
                echo "========================================"
                echo "Android Staging Build"
                echo "========================================"
                echo "Build Number: $(Build.BuildNumber)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "========================================"

          # Free up disk space
          - script: |
              echo "=== Disk space before cleanup ==="
              df -h /
              sudo rm -rf /usr/share/dotnet
              sudo rm -rf /usr/local/lib/android/sdk/ndk
              sudo rm -rf /opt/ghc
              sudo rm -rf /opt/hostedtoolcache
              echo "=== Disk space after cleanup ==="
              df -h /
            displayName: 'Free Disk Space'
            continueOnError: true

          # Download keystore
          - task: DownloadSecureFile@1
            name: androidKeystore
            displayName: 'Download Android Keystore'
            inputs:
              secureFile: 'upload-keystore.jks'

          - script: |
              cp $(androidKeystore.secureFilePath) $(workingDirectory)/android/app/upload-keystore.jks
              echo "✅ Keystore copied"
            displayName: 'Setup Keystore'

          # Install Flutter SDK
          - task: FlutterInstall@0
            displayName: 'Install Flutter SDK'
            inputs:
              mode: 'auto'
              channel: '$(flutterVersion)'
              version: 'latest'

          # Get dependencies
          - script: |
              cd $(workingDirectory)
              flutter pub get
            displayName: 'Flutter Pub Get'

          # Cache Gradle dependencies
          - task: Cache@2
            displayName: 'Cache Gradle'
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts | $(workingDirectory)/android/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)" | $(workingDirectory)/android/app/build.gradle.kts
                gradle | "$(Agent.OS)"
              path: $(HOME)/.gradle/caches

          # Run code generation
          - script: |
              cd $(workingDirectory)
              flutter pub run build_runner build --delete-conflicting-outputs
            displayName: 'Run Build Runner'

          # Build Android AAB
          - script: |
              cd $(workingDirectory)
              flutter build appbundle \
                -t lib/main_staging.dart \
                --release \
                --dart-define=ENVIRONMENT=staging \
                "--dart-define=AUTH_AUTHORITY=$(AUTH_AUTHORITY)" \
                "--dart-define=API_BASE_URL=$(API_BASE_URL)" \
                "--dart-define=CLIENT_ID=$(CLIENT_ID)" \
                "--dart-define=REDIRECT_URI=$(REDIRECT_URI)" \
                "--dart-define=POST_LOGOUT_REDIRECT_URI=$(POST_LOGOUT_REDIRECT_URI)" \
                "--dart-define=SCOPES=$(SCOPES)" \
                "--dart-define=APP_NAME=$(APP_NAME)"
            displayName: 'Build Android AAB'
            env:
              KEY_PASSWORD: $(KEY_PASSWORD)
              KEY_ALIAS: $(KEY_ALIAS)
              KEYSTORE_FILE: $(workingDirectory)/android/app/upload-keystore.jks

          # Copy AAB to staging directory
          - task: CopyFiles@2
            displayName: 'Copy AAB to Staging'
            inputs:
              sourceFolder: '$(workingDirectory)/build/app/outputs/bundle/stagingRelease'
              contents: '**/*.aab'
              targetFolder: '$(Build.ArtifactStagingDirectory)/android'
              flattenFolders: true

          # Publish AAB artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Staging AAB'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/android'
              ArtifactName: 'sigookapp-android-staging'
              publishLocation: 'Container'

          - task: Bash@3
            displayName: 'Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "========================================"
                echo "✅ Staging Android Build Complete!"
                echo "========================================"
                echo "Artifact: sigookapp-android-staging"
                echo "Build ID: $(Build.BuildId)"
                echo "========================================"
