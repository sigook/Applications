# Azure Pipeline for Sigook.Functions (Azure Functions .NET 8)
# Builds and deploys Azure Functions to Azure Function App (Production only)

name: Sigook.Functions-$(Year:yyyy).$(Month).$(DayOfMonth).$(Rev:r)

# Only trigger when merging to main/master (production deployment)
trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - Sigook.Functions/**
    exclude:
      - Sigook.Functions/**/*.md

# No PR trigger - PRs to main come from dev (already validated)
pr: none

pool:
  name: 'covenant-build-pool'

# Variables
variables:
  dotnetSdkVersion: '8.0.415'
  azureFunctionAppName: 'sigook-functions'
  environment: 'Production'
  isPR: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
  # ============================================
  # Stage 1: Build
  # ============================================
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: Build_Solution
        displayName: 'Build Solution'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Install .NET SDK using template
          - template: templates/dotnet-setup.yml
            parameters:
              sdkVersion: $(dotnetSdkVersion)

          # Build using template (no unit tests - project has none)
          - template: templates/dotnet-build-test.yml
            parameters:
              buildProjects: 'Sigook.Functions/**/*.sln'
              buildConfiguration: 'Release'
              runUnitTests: false
              runIntegrationTests: false

  # ============================================
  # Stage 2: Publish and Deploy to Production
  # ============================================
  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), ne(variables.isPR, true))
    jobs:
      - job: Publish_and_Deploy
        displayName: 'Publish and Deploy to Production'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Install .NET SDK using template
          - template: templates/dotnet-setup.yml
            parameters:
              sdkVersion: $(dotnetSdkVersion)

          # Authenticate with Azure Artifacts for Covenant.Common package
          - task: NuGetAuthenticate@1
            displayName: 'Authenticate NuGet Feed'

          # Publish Azure Functions
          - task: DotNetCoreCLI@2
            displayName: 'Publish Azure Functions'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'Sigook.Functions/Sigook.Functions/Sigook.Functions.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: true

          # Deploy to Azure Function App (Production)
          - task: AzureFunctionApp@2
            displayName: 'Deploy to Azure Function App (Production)'
            inputs:
              azureSubscription: 'SigookPipelines'
              appType: 'functionApp'
              appName: $(azureFunctionAppName)
              package: '$(Build.ArtifactStagingDirectory)/publish/*.zip'
              appSettings: '-AZURE_FUNCTIONS_ENVIRONMENT $(environment)'
              deploymentMethod: 'auto'

          # Deployment Summary
          - task: Bash@3
            displayName: 'Deployment Summary'
            inputs:
              targetType: 'inline'
              script: |
                echo ""
                echo "============================================"
                echo "🚀 Deployment Completed Successfully!"
                echo "============================================"
                echo "Environment: $(environment)"
                echo "Function App: $(azureFunctionAppName)"
                echo "Version: $(Build.BuildId)"
                echo "============================================"
                echo ""
                echo "Production URL:"
                echo "https://sigook-functions.azurewebsites.net"
                echo ""

          # Cleanup after publish and deploy
          - template: templates/cleanup.yml
            parameters:
              cleanDotnet: true
              workingDirectory: 'Sigook.Functions'
