# Azure Pipeline for Sigook.Functions (Azure Functions .NET 8)
# Builds and deploys Azure Functions to Azure Function App (Production only)

name: Sigook.Functions-$(Year:yyyy).$(Month).$(DayOfMonth).$(Rev:r)

# Trigger disabled - production deployments are triggered manually
trigger: none

# PR trigger - validate build on PRs to main
pr:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - Sigook.Functions/**
    exclude:
      - Sigook.Functions/**/*.md

pool:
  name: 'covenant-build-pool'

# Variables
variables:
  dotnetSdkVersion: '8.0.415'
  azureFunctionAppName: 'sigook-functions'
  environment: 'Production'

stages:
  # ============================================
  # Stage 1: Build and Deploy to Production
  # ============================================
  - stage: Build_and_Deploy
    displayName: 'Build and Deploy to Production'
    jobs:
      - job: Build_Solution
        displayName: 'Build, Publish and Deploy'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
            fetchDepth: 1

          # Install .NET SDK using template
          - template: templates/dotnet-setup.yml
            parameters:
              sdkVersion: $(dotnetSdkVersion)

          # Build and run unit tests using template
          - template: templates/dotnet-build-test.yml
            parameters:
              buildProjects: 'Sigook.Functions/**/*.sln'
              buildConfiguration: 'Release'
              runUnitTests: true
              unitTestProjects: 'Sigook.Functions/Sigook.Functions.Tests/Sigook.Functions.Tests.csproj'
              runIntegrationTests: false

          # Publish and deploy on manual runs only (PRs just build)
          - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
            # Publish Azure Functions
            - task: DotNetCoreCLI@2
              displayName: 'Publish Azure Functions'
              inputs:
                command: 'publish'
                publishWebProjects: false
                projects: 'Sigook.Functions/Sigook.Functions/Sigook.Functions.csproj'
                arguments: '--configuration Release --no-build --output $(Build.ArtifactStagingDirectory)/publish'
                zipAfterPublish: true

            # Deploy to Azure Function App (Production)
            - task: AzureFunctionApp@2
              displayName: 'Deploy to Azure Function App (Production)'
              inputs:
                azureSubscription: 'SigookPipelines'
                appType: 'functionApp'
                appName: $(azureFunctionAppName)
                package: '$(Build.ArtifactStagingDirectory)/publish/*.zip'
                appSettings: '-AZURE_FUNCTIONS_ENVIRONMENT $(environment)'
                deploymentMethod: 'auto'

            # Deployment Summary
            - task: Bash@3
              displayName: 'Deployment Summary'
              inputs:
                targetType: 'inline'
                script: |
                  echo ""
                  echo "============================================"
                  echo "🚀 Deployment Completed Successfully!"
                  echo "============================================"
                  echo "Environment: $(environment)"
                  echo "Function App: $(azureFunctionAppName)"
                  echo "Version: $(Build.BuildId)"
                  echo "============================================"
                  echo ""
                  echo "Production URL:"
                  echo "https://sigook-functions.azurewebsites.net"
                  echo ""

          # Cleanup after build
          - template: templates/cleanup.yml
            parameters:
              cleanDotnet: true
              workingDirectory: 'Sigook.Functions'
