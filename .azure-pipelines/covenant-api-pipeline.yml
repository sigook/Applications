# Azure Pipeline for Covenant.Api (.NET 10 API + OpenIddict authorization server)
# Builds, tests, and deploys .NET API to Azure App Service via Docker

name: CovenantApi-$(Year:yyyy).$(Month).$(DayOfMonth).$(Rev:r)

# Only trigger when Covenant.Api files change on dev
# Production (main) deployments are triggered manually
# Sigook.Functions lives in the same solution but has its own pipeline
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - Covenant.Api/**
    exclude:
      - Covenant.Api/**/*.md
      - Covenant.Api/Sigook.Functions/**
      - Covenant.Api/Sigook.Functions.Tests/**

# PR trigger - only validate PRs to dev (not to main)
# PRs to main are trusted since dev is the quality gate
pr:
  branches:
    include:
      - dev
  paths:
    include:
      - Covenant.Api/**

pool:
  name: 'covenant-build-pool'

# Environment detection variables
# Target values resolve at compile time: main/master → production, anything else → staging
variables:
  isMain: $[in(variables['Build.SourceBranch'], 'refs/heads/main','refs/heads/master','main','master')]
  isDev: $[in(variables['Build.SourceBranch'], 'refs/heads/dev','refs/heads/development','dev','development')]
  dotnetSdkVersion: '10.0.401'
  ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
    deployEnvironment: 'production'
    dockerTag: 'latest_production'
    azureAppName: 'sigook-api'
    appUrl: 'https://sigook-api.azurewebsites.net'
    identityUrl: 'https://accounts.sigook.ca'
  ${{ if notIn(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
    deployEnvironment: 'staging'
    dockerTag: 'latest_staging'
    azureAppName: 'sigook-api-staging'
    appUrl: 'https://sigook-api-staging.azurewebsites.net'
    identityUrl: 'https://staging.accounts.sigook.ca'

stages:
  # ============================================
  # Stage 1: Build, Test and Docker Image
  # ============================================
  - stage: Build_and_Test
    displayName: 'Build and Test'
    jobs:
      - job: Build_Test_Solution
        displayName: 'Build, Test and Publish Image'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
            fetchDepth: 1

          # Install .NET SDK using template
          - template: templates/dotnet-setup.yml
            parameters:
              sdkVersion: $(dotnetSdkVersion)

          # Build and Test using template
          - template: templates/dotnet-build-test.yml
            parameters:
              buildProjects: 'Covenant.Api/Covenant.Api.slnx'
              buildConfiguration: 'Release'
              runUnitTests: true
              unitTestProjects: |
                Covenant.Api/Covenant.Tests/Covenant.Tests.csproj
                Covenant.Api/Sigook.Functions.Tests/Sigook.Functions.Tests.csproj
              runIntegrationTests: true
              integrationTestProjects: 'Covenant.Api/Covenant.Integration.Tests/Covenant.Integration.Tests.csproj'

          # Publish + Docker image only on dev/main (PRs just build and test)
          - ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/dev', 'refs/heads/development') }}:
            # Reuse the Release build from the previous step; the image only copies this output
            - task: DotNetCoreCLI@2
              displayName: 'Publish API'
              inputs:
                command: 'publish'
                publishWebProjects: false
                projects: 'Covenant.Api/Covenant.Api/Covenant.Api.csproj'
                arguments: '--configuration Release --no-build --output $(Build.ArtifactStagingDirectory)/api'
                zipAfterPublish: false
                modifyOutputPath: false

            # Build and Push Docker Image
            - task: Docker@2
              displayName: 'Build and Push Docker Image'
              inputs:
                containerRegistry: 'acrServiceConnectionSigook'
                repository: 'api'
                command: 'buildAndPush'
                Dockerfile: 'Covenant.Api/Dockerfile'
                buildContext: '$(Build.ArtifactStagingDirectory)/api'
                # $(dockerTag) is mutable (latest_staging/latest_production) and is
                # kept for anything that tracks the newest image. The deploy targets
                # the immutable $(Build.BuildId) tag, so a restart cannot silently
                # pull an image that was never deployed, and rollback stays possible.
                tags: |
                  $(dockerTag)
                  $(Build.BuildId)

          # Cleanup after build (bin/obj must not leak into the next run's workspace)
          - template: templates/cleanup.yml
            parameters:
              cleanDocker: true
              cleanDotnet: true
              workingDirectory: 'Covenant.Api'

  # ============================================
  # Stage 2: Deploy
  # ============================================
  - stage: CI_CD
    displayName: 'Deploy'
    dependsOn: Build_and_Test
    condition: and(succeeded(), or(eq(variables['isDev'], true), eq(variables['isMain'], true)))
    jobs:
      - deployment: Deploy_to_Azure
        displayName: 'Deploy to Azure App Service'
        environment: ${{ variables.deployEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                # Deploy to Azure App Service
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to $(azureAppName)'
                  inputs:
                    azureSubscription: 'SigookPipelines'
                    appName: $(azureAppName)
                    containers: 'sigook.azurecr.io/api:$(Build.BuildId)'
                    appSettings: '-CVN_VERSION $(Build.BuildId)'

                - script: |
                    echo "✅ Deployed sigook.azurecr.io/api:$(Build.BuildId) to $(azureAppName) ($(deployEnvironment))"
                    echo "URL: $(appUrl)"
                    echo "Identity: $(identityUrl)/.well-known/openid-configuration"
                  displayName: 'Deployment Summary'

  # ============================================
  # Stage 3: Notify Production Deployment
  # ============================================
  - stage: Notify
    displayName: 'Notify Production Deploy'
    dependsOn: CI_CD
    condition: and(succeeded(), eq(variables['isMain'], true))
    jobs:
      - job: SendEmail
        displayName: 'Send Deployment Email'
        variables:
          - group: Sigook-Notifications
        steps:
          - checkout: none
          - template: templates/notify-deployment.yml
            parameters:
              appType: 'api'
              recipients: '$(NotificationRecipients)'
