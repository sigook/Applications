# Azure Pipeline for Sigook.Mcp (Node MCP server, npm package @sigook/mcp)
# Builds and tests on PRs; publishes the package to the Azure Artifacts feed `sigook-tools`:
#   dev  -> prerelease  <package.json version>-dev.<BuildId>, dist-tag `dev`
#   main -> stable      <package.json version>, dist-tag `latest` (manual run)

name: Sigook.Mcp-$(Year:yyyy).$(Month).$(DayOfMonth).$(Rev:r)

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - Sigook.Mcp/**

pr:
  branches:
    include:
      - dev
  paths:
    include:
      - Sigook.Mcp/**

pool:
  name: 'covenant-build-pool'

variables:
  nodeVersion: '22.x'
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    versionSuffix: ''
    distTag: 'latest'
  ${{ else }}:
    versionSuffix: '-dev.$(Build.BuildId)'
    distTag: 'dev'

stages:
  - stage: Build_and_Publish
    displayName: 'Build and Publish Package'
    jobs:
      - job: Build_Package
        displayName: 'Build, Test and Publish @sigook/mcp'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
            fetchDepth: 1

          - template: templates/node-setup.yml
            parameters:
              nodeVersion: $(nodeVersion)

          - script: npm ci
            displayName: 'Install Dependencies'
            workingDirectory: Sigook.Mcp

          - script: npm test
            displayName: 'Build and Test'
            workingDirectory: Sigook.Mcp

          - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
            - task: npmAuthenticate@0
              displayName: 'Authenticate to Azure Artifacts'
              inputs:
                workingFile: Sigook.Mcp/.npmrc

            - task: Bash@3
              displayName: 'Publish to sigook-tools'
              inputs:
                targetType: 'inline'
                workingDirectory: Sigook.Mcp
                script: |
                  set -euo pipefail
                  base=$(node -p "require('./package.json').version")
                  version="${base}$(versionSuffix)"
                  npm version "$version" --no-git-tag-version --allow-same-version
                  if npm view "@sigook/mcp@$version" version >/dev/null 2>&1; then
                    echo "@sigook/mcp@$version already published; skipping."
                    exit 0
                  fi
                  npm publish --tag "$(distTag)"
                  echo "Published @sigook/mcp@$version (dist-tag $(distTag))"

          - template: templates/cleanup.yml
            parameters:
              cleanNodeModules: true
              workingDirectory: 'Sigook.Mcp'
