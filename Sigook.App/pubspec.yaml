name: sigook_app_flutter
description: "Sigook worker mobile app."
publish_to: 'none'

# =============================================================================
# APP VERSIONING (Date-based)
# =============================================================================
# Version Format: YYYY.M.D+BUILD_NUMBER
#   - build-name: Date-based version (e.g., "2026.2.5")
#   - build-number: Auto-incrementing integer for app stores
#
# CI/CD Pipeline (Azure DevOps):
#   - Automatically calculates version from build date
#   - Uses Build.BuildId as build-number (always increasing)
#   - Overrides this value with --build-name and --build-number flags
#
# Local Development:
#   - This value is used for local builds
#   - Update manually or use: flutter build --build-name="$(date +%Y.%-m.%-d)"
#
# App Store Requirements:
#   - Google Play: versionCode (build-number) must always increase
#   - App Store: CFBundleVersion (build-number) must always increase
# =============================================================================
version: 2026.2.6+20260206

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Immutability and Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  intl: ^0.20.2
  equatable: ^3.0.0
  uuid: ^4.5.1
  mask_text_input_formatter: ^2.9.0

  # Local Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.4
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Routing
  go_router: ^18.0.1

  # HTTP Client
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  
  # Network
  connectivity_plus: ^7.0.0
  retry: ^3.1.2

  # SVG rendering
  flutter_svg: ^2.1.0

  # File Picker (Cross-platform file selection for iOS/Android/Web)
  # Pinned: 12.x+ split the Android implementation into the android_file_picker
  # package, whose build.gradle.kts declares its own AGP classpath and then reads
  # the `flutter` Gradle extension, which is not registered in that module.
  # Any 12.x/13.x fails the Android build with "Extension with name 'flutter'
  # does not exist". Unpin once flutter/flutter#180137 (AGP newDsl migration) lands.
  file_picker: 10.3.7
  image_picker: ^1.2.1
  image_cropper: ^12.0.0
  permission_handler: ^13.0.2
  geolocator: ^13.0.2
  riverpod: ^3.4.3
  jwt_decoder: ^2.0.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1
  open_filex: ^5.0.0
  pdfx: ^2.11.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.7.1
  freezed: ^4.0.1
  json_serializable: ^6.11.1
  riverpod_generator: ^4.0.7

flutter:

  # Keep iOS plugins on CocoaPods. Under Swift Package Manager the manifests of
  # image_cropper (TOCropViewController 3.x) and file_picker's
  # DKImagePickerController (TOCropViewController 2.x) cannot be resolved
  # together; the podspecs do not pull the conflicting subspec.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/welcome-screen/
    - assets/i18n/
