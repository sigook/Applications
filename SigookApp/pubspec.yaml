name: sigook_app_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# =============================================================================
# APP VERSIONING (Date-based)
# =============================================================================
# Version Format: YYYY.M.D+BUILD_NUMBER
#   - build-name: Date-based version (e.g., "2026.2.5")
#   - build-number: Auto-incrementing integer for app stores
#
# CI/CD Pipeline (Azure DevOps):
#   - Automatically calculates version from build date
#   - Uses Build.BuildId as build-number (always increasing)
#   - Overrides this value with --build-name and --build-number flags
#
# Local Development:
#   - This value is used for local builds
#   - Update manually or use: flutter build --build-name="$(date +%Y.%-m.%-d)"
#
# App Store Requirements:
#   - Google Play: versionCode (build-number) must always increase
#   - App Store: CFBundleVersion (build-number) must always increase
# =============================================================================
version: 2026.2.5+100

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Immutability and Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Functional Programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^9.0.5

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  phone_numbers_parser: ^9.0.16
  uuid: ^4.5.1
  mask_text_input_formatter: ^2.9.0
  table_calendar: ^3.1.2

  # Local Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Routing
  go_router: ^17.0.0

  # HTTP Client
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  
  # Network
  connectivity_plus: ^7.0.0
  retry: ^3.1.2

  # File Picker (Cross-platform file selection for iOS/Android/Web)
  file_picker: 10.3.7  # Pinned - version 10.3.9 has breaking API changes (FilePicker.platform removed)
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  openid_client: ^0.4.9+1
  flutter_appauth: ^11.0.0
  webview_flutter: ^4.13.0
  riverpod: ^3.0.3
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  riverpod_generator: ^3.0.3

  # App Icon Generation
  flutter_launcher_icons: ^0.14.3

# App Icon Configuration
# To generate icons, run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  # Remove alpha channel for iOS (required by Apple)
  remove_alpha_ios: true
  # Adaptive icon for Android (optional, uses same icon)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # Environment files for local development (flutter_dotenv)
    # These are optional - CI/CD builds use --dart-define instead
    # If a file doesn't exist, EnvLoader handles it gracefully
    - .env.staging
    - .env.production
    - .env.local
    - assets/images/
    - assets/images/logo/
    - assets/i18n/
    - assets/i18n/error_messages_en.json
    - assets/i18n/error_messages_es.json
    - assets/i18n/error_messages_fr.json
    - assets/i18n/app_en.json
    - assets/i18n/app_es.json
    - assets/i18n/app_fr.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package