server {
     listen       80;
     server_name  localhost;
     #charset koi8-r;
     #access_log  /var/log/nginx/host.access.log  main;
     root /usr/share/nginx/html;
     index index.html;

     # 301 redirects: legacy landing slugs -> v2 canonical URLs (permanent).
     # The legacy landing was removed in the v2-only migration; these preserve
     # SEO equity from previously indexed URLs and keep old inbound links working.
     # Note: /privacy-policy and /terms-and-conditions are intentionally NOT here
     # because v2 serves those same slugs directly.
     location = /home          { return 301 /; }
     location = /about-us      { return 301 /about; }
     location = /direct-hiring { return 301 /employers; }
     location = /contact       { return 301 /; }
     location = /atas          { return 301 /; }
     location ~ ^/jobSeekers(/.*)?$ { return 301 /open-positions; }
     location ~ ^/business(/.*)?$   { return 301 /employers; }

     location / {
         try_files $uri $uri/ @rewrites;
     }
     
     location @rewrites{
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                expires -1;
                rewrite ^(.+)$ /index.html last;   
     }
     
     location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
     # Some basic cache-control for static files to be sent to the browser
           expires max;
           add_header Pragma public;
           add_header Cache-Control "public, must-revalidate, proxy-revalidate";
     }
     #error_page  404              /404.html;
     # redirect server error pages to the static page /50x.html
     #
     error_page   500 502 503 504  /50x.html;
     location = /50x.html {
         root   /usr/share/nginx/html;
     }
     
     location ~* \.html?$ {
         expires -1;
         add_header Pragma "no-cache";
         add_header Cache-Control "no-store, must-revalidate";
     }
 }