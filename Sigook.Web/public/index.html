<!DOCTYPE html>
<html>
  
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="build" content="#{Build.BuildNumber}#">
  <meta name="description" content="Sigook connects job seekers with top employers across Canada and the US. Find temporary, contract, and permanent jobs in skilled trades, industrial, and professional sectors.">
  <meta name="keywords" content="staffing agency, job seekers, temporary jobs, recruitment, skilled trades, industrial jobs, Canada jobs, US jobs, Sigook, employment agency">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.sigook.com/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.sigook.com/">
  <meta property="og:title" content="Sigook® - Connecting Talent with Opportunity">
  <meta property="og:description" content="Sigook connects job seekers with top employers across Canada and the US. Find temporary, contract, and permanent jobs in skilled trades, industrial, and professional sectors.">
  <meta property="og:site_name" content="Sigook">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sigook® - Connecting Talent with Opportunity">
  <meta name="twitter:description" content="Sigook connects job seekers with top employers across Canada and the US. Find temporary, contract, and permanent jobs in skilled trades, industrial, and professional sectors.">

  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@5.8.55/css/materialdesignicons.min.css">
  <title>Sigook® - Connecting Talent with Opportunity</title>

  <style>
    .v-data {
      position: absolute;
      transform: translateY(-18px);
      right: 4px;
      z-index: 999999999;
      font-size: 10px;
      color: #a7a7a7;
    }

    .v-data::selection {
      color: white;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div class="v-data"> v#{Build.BuildNumber}# </div>
</body>

</html>
